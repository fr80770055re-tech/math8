<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業繳交小幫手 - 綜合數學出題</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .math-font { 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 1.3rem; 
            line-height: 1.3;
            letter-spacing: 0.1em;
            white-space: pre; 
        }
        body { margin: 0; overflow-x: hidden; background-color: #f8fafc; }
        
        .detail-hidden { display: none; }
        .detail-show { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 font-sans flex flex-col min-h-screen" onload="initApp()">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center px-6">
        <div class="flex items-center gap-3">
            <span class="text-2xl">📖</span>
            <h1 class="text-xl font-bold tracking-wider">作業繳交小幫手</h1>
        </div>
        <div class="text-sm font-medium opacity-80" id="countDisplay">
            累積出題：0 次
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-6 flex-1 flex flex-col gap-5">
        
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-6 items-center">
                <div class="flex items-center gap-2">
                    <span class="text-gray-600 font-bold">題型：</span>
                    <select id="modeSelect" class="border border-gray-300 rounded-md px-3 py-1.5 outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="mix">基礎直式：混合模式 (乘除各半)</option>
                        <option value="mul">基礎直式：純乘法練習</option>
                        <option value="div">基礎直式：純除法練習</option>
                        <option value="simplify">特別單元：純簡化計算 (含四則/減法湊整)</option>
                        <option value="time">特別單元：純時間換算 (複名數/日時分秒進退位)</option>
                        <option value="factors">特別單元：純因數練習</option>
                        <option value="multiples">特別單元：純倍數練習</option>
                        <option value="commonFactor">特別單元：純公因數練習</option>
                        <option value="commonMultiple">特別單元：純公倍數練習</option>
                        <option value="fraction">特別單元：分數加減 (異分母通分)</option>
                    </select>
                </div>
                <div id="digitSettings" class="flex items-center gap-2 text-gray-600 font-bold">
                    位數：
                    <select id="d1Select" class="border rounded px-2 py-1">
                        <option value="3">3位</option><option value="4">4位</option><option value="5">5位</option>
                    </select>
                    <span class="text-lg mx-1">÷/×</span>
                    <select id="d2Select" class="border rounded px-2 py-1">
                        <option value="1">1位</option><option value="2" selected>2位</option><option value="3">3位</option>
                    </select>
                </div>
                <div id="zeroSettings" class="flex items-center gap-2 text-blue-700 font-bold bg-blue-50 px-3 py-1.5 rounded-md border border-blue-200 shadow-sm cursor-pointer hover:bg-blue-100 transition">
                    <input type="checkbox" id="zeroCheck" class="w-4 h-4 cursor-pointer accent-blue-600">
                    <label for="zeroCheck" class="cursor-pointer select-none">尾數含 0 (速算練習)</label>
                </div>
                <div id="hintSettings" style="display:none" class="flex items-center gap-2 text-violet-700 font-bold bg-violet-50 px-3 py-1.5 rounded-md border border-violet-200 shadow-sm cursor-pointer hover:bg-violet-100 transition">
                    <input type="checkbox" id="hintCheck" class="w-4 h-4 cursor-pointer accent-violet-600" onchange="renderAll()">
                    <label for="hintCheck" class="cursor-pointer select-none">題目附橫式提示 (鷹架，不含答案)</label>
                </div>
            </div>
            <button onclick="generateAll()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md font-bold transition shadow-sm">
                ＋ 重新出題 (8題)
            </button>
        </div>

        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl flex gap-4 items-center shadow-sm">
            <button onclick="saveCurrentToHistory()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition flex-shrink-0">
                💾 儲存目前這組題目
            </button>
            <div class="w-px h-8 bg-indigo-200 mx-2"></div>
            <div class="text-sm text-indigo-800 font-bold flex-shrink-0">讀取存檔：</div>
            <div id="historyContainer" class="flex flex-wrap gap-2 items-center flex-1">
                </div>
        </div>

        <div id="quizContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        
    </main>

    <script>
        let questions = [];
        let practiceCount = parseInt(localStorage.getItem('math_pure_count') || '0');
        let historyRecords = JSON.parse(localStorage.getItem('math_snapshots') || '[]');

        function initApp() {
            document.getElementById('countDisplay').innerText = `累積出題：${practiceCount} 次`;
            
            document.getElementById('modeSelect').addEventListener('change', function(e) {
                const val = e.target.value;
                const noDigitModes = ['simplify', 'time', 'factors', 'multiples', 'commonFactor', 'commonMultiple', 'fraction'];
                if (noDigitModes.includes(val)) {
                    document.getElementById('digitSettings').style.display = 'none';
                    document.getElementById('zeroSettings').style.display = 'none';
                } else {
                    document.getElementById('digitSettings').style.display = 'flex';
                    document.getElementById('zeroSettings').style.display = 'flex';
                }
                const factorModes = ['factors', 'multiples', 'commonFactor', 'commonMultiple'];
                document.getElementById('hintSettings').style.display = factorModes.includes(val) ? 'flex' : 'none';
                generateAll();
            });

            renderHistory();
            generateAll();
        }

        function generateNum(digits) {
            if (digits <= 0) return 0;
            const min = Math.pow(10, digits - 1);
            const max = Math.pow(10, digits) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getTrailingZeroNum(digits) {
            if (digits === 1) return generateNum(1);
            const maxZeros = digits - 1;
            const zeroCount = Math.floor(Math.random() * Math.min(2, maxZeros)) + 1; 
            const baseDigits = digits - zeroCount;
            return generateNum(baseDigits) * Math.pow(10, zeroCount);
        }

        // ================= 因數／倍數／公因數／公倍數 出題邏輯 =================
        function gcdCalc(a, b) {
            while (b) { const t = a % b; a = b; b = t; }
            return a;
        }
        function lcmCalc(a, b) {
            return (a * b) / gcdCalc(a, b);
        }

        function generateFactorQuestion(kind) {
            const qData = { type: 'factor', subType: kind };

            const factorPool = [12, 16, 18, 20, 24, 28, 30, 32, 36, 40, 42, 45, 48];
            const smallPool = [2, 3, 4, 5, 6, 7, 8, 9, 10, 12];
            const pairPool = [[12, 18], [8, 12], [16, 24], [9, 15], [10, 15], [6, 9], [14, 21], [20, 30], [15, 20], [12, 16]];
            const multiplePairPool = [[4, 6], [3, 4], [6, 8], [4, 5], [6, 9], [3, 5], [8, 12], [5, 6], [9, 12], [4, 10]];

            if (kind === 'factors') {
                qData.n = factorPool[Math.floor(Math.random() * factorPool.length)];
            } else if (kind === 'multiples') {
                qData.n = smallPool[Math.floor(Math.random() * smallPool.length)];
                qData.count = 6;
            } else if (kind === 'common_factors') {
                const pair = pairPool[Math.floor(Math.random() * pairPool.length)];
                qData.a = pair[0]; qData.b = pair[1];
            } else {
                const pair = multiplePairPool[Math.floor(Math.random() * multiplePairPool.length)];
                qData.a = pair[0]; qData.b = pair[1];
                qData.count = 3;
            }
            return qData;
        }

        // ================= 分數加減 (異分母通分) 出題邏輯 =================
        function generateFractionQuestion() {
            const qData = { type: 'fraction' };
            qData.op = Math.random() > 0.5 ? '+' : '-';

            const denomPairs = [[2, 3], [2, 5], [3, 4], [2, 7], [3, 5], [4, 5], [2, 9], [3, 7], [5, 6], [3, 8], [4, 7], [5, 8]];
            const pair = denomPairs[Math.floor(Math.random() * denomPairs.length)];
            let d1 = pair[0], d2 = pair[1];
            if (Math.random() > 0.5) { [d1, d2] = [d2, d1]; }

            let n1 = Math.floor(Math.random() * (d1 - 1)) + 1;
            let n2 = Math.floor(Math.random() * (d2 - 1)) + 1;

            if (qData.op === '-' && (n1 / d1) < (n2 / d2)) {
                [n1, d1, n2, d2] = [n2, d2, n1, d1];
            }

            qData.n1 = n1; qData.d1 = d1; qData.n2 = n2; qData.d2 = d2;
            return qData;
        }

        const FACTOR_KIND_MAP = { factors: 'factors', multiples: 'multiples', commonFactor: 'common_factors', commonMultiple: 'common_multiples' };

        // ================= 出題核心邏輯 =================
        function generateAll() {
            const mode = document.getElementById('modeSelect').value;
            const d1 = parseInt(document.getElementById('d1Select').value);
            const d2 = parseInt(document.getElementById('d2Select').value);
            const isZeroMode = document.getElementById('zeroCheck').checked;

            questions = [];
            for (let i = 0; i < 8; i++) {
                let qData = {
                    id: Math.random().toString(36).substring(2, 9),
                    label: `第 ${String(i + 1).padStart(2, '0')} 題`,
                    show: false
                };

                if (mode === 'simplify') {
                    qData.type = 'simplify';
                    // 隨機決定型態：加法、乘法、或是新增的【減法湊整】
                    const types = ['add', 'mul', 'sub_two', 'sub_near'];
                    qData.subType = types[Math.floor(Math.random() * types.length)];
                    
                    if (qData.subType === 'add') {
                        const target = (Math.floor(Math.random() * 5) + 5) * 10; 
                        const n1 = Math.floor(Math.random() * (target - 25)) + 11;
                        const n2 = target - n1;
                        const n3 = Math.floor(Math.random() * 80) + 15;
                        qData.nums = [n1, n2, n3].sort(() => Math.random() - 0.5);
                    } else if (qData.subType === 'mul') {
                        const pairs = [[25, 4], [125, 8], [5, 20], [50, 2]];
                        const chosenPair = pairs[Math.floor(Math.random() * pairs.length)];
                        const n3 = Math.floor(Math.random() * 40) + 11;
                        qData.nums = [chosenPair[0], chosenPair[1], n3].sort(() => Math.random() - 0.5);
                    } else if (qData.subType === 'sub_two') {
                        // 連減法湊整：A - B - C -> A - (B + C)
                        const bcTarget = (Math.floor(Math.random() * 4) + 4) * 10; // B+C 湊成 40~70
                        const b = Math.floor(Math.random() * (bcTarget - 15)) + 11;
                        const c = bcTarget - b;
                        const a = bcTarget + Math.floor(Math.random() * 100) + 35; // 確保 A 大於 B+C
                        qData.nums = [a, b, c]; // 固定順序：A - B - C
                    } else if (qData.subType === 'sub_near') {
                        // 接近整百的減法：A - 99 或 A - 98
                        const subNum = Math.random() > 0.5 ? 99 : 98;
                        const a = Math.floor(Math.random() * 150) + 120;
                        qData.nums = [a, subNum];
                    }
                } else if (mode === 'time') {
                    qData.type = 'time';
                    // 包含單一換算與【複名數換算、未滿一日/時/分】的多元題型
                    const directions = ['compound_to_small', 'small_to_compound', 'under_one_unit'];
                    qData.subType = directions[Math.floor(Math.random() * directions.length)];
                    
                    if (qData.subType === 'compound_to_small') {
                        // 複名數換成單一小單位，例如：2時15分 = ()分
                        qData.unitPair = Math.random() > 0.5 ? {big: '小時', small: '分鐘', rate: 60} : {big: '分鐘', small: '秒', rate: 60};
                        if (Math.random() > 0.6) qData.unitPair = {big: '日', small: '小時', rate: 24};
                        qData.vBig = Math.floor(Math.random() * 5) + 1;
                        qData.vSmall = Math.floor(Math.random() * (qData.unitPair.rate - 5)) + 2;
                    } else if (qData.subType === 'small_to_compound') {
                        // 大量小單位換成複名數，例如：135秒 = ()分()秒
                        qData.unitPair = Math.random() > 0.5 ? {big: '小時', small: '分鐘', rate: 60} : {big: '分鐘', small: '秒', rate: 60};
                        if (Math.random() > 0.6) qData.unitPair = {big: '日', small: '小時', rate: 24};
                        qData.totalSmall = Math.floor(Math.random() * (qData.unitPair.rate * 3)) + (qData.unitPair.rate + 5);
                    } else {
                        // 【未滿一日、一時、一分】的特殊除法思維題
                        qData.unitPair = Math.random() > 0.5 ? {big: '日', small: '小時', rate: 24} : {big: '小時', small: '分鐘', rate: 60};
                        if (Math.random() > 0.5 && qData.unitPair.big === '日') qData.unitPair = {big: '分鐘', small: '秒', rate: 60};
                        qData.totalSmall = Math.floor(Math.random() * (qData.unitPair.rate - 5)) + 3; // 刻意讓總數小於進位率
                    }
                } else if (FACTOR_KIND_MAP[mode]) {
                    Object.assign(qData, generateFactorQuestion(FACTOR_KIND_MAP[mode]));
                } else if (mode === 'fraction') {
                    Object.assign(qData, generateFractionQuestion());
                } else {
                    qData.type = mode === 'mix' ? (i < 4 ? 'mul' : 'div') : mode;
                    qData.n1 = isZeroMode ? getTrailingZeroNum(d1) : generateNum(d1);
                    qData.n2 = isZeroMode ? getTrailingZeroNum(d2) : generateNum(d2);
                }

                questions.push(qData);
            }

            practiceCount++;
            localStorage.setItem('math_pure_count', practiceCount);
            document.getElementById('countDisplay').innerText = `累積出題：${practiceCount} 次`;
            renderAll();
        }

        function refreshOne(event, index) {
            event.stopPropagation();
            const mode = document.getElementById('modeSelect').value;
            const d1 = parseInt(document.getElementById('d1Select').value);
            const d2 = parseInt(document.getElementById('d2Select').value);
            const isZeroMode = document.getElementById('zeroCheck').checked;

            let qData = {
                id: Math.random().toString(36).substring(2, 9),
                label: `第 ${String(index + 1).padStart(2, '0')} 題`,
                show: false
            };

            if (mode === 'simplify') {
                qData.type = 'simplify';
                const types = ['add', 'mul', 'sub_two', 'sub_near'];
                qData.subType = types[Math.floor(Math.random() * types.length)];
                if (qData.subType === 'add') {
                    const target = (Math.floor(Math.random() * 5) + 5) * 10;
                    const n1 = Math.floor(Math.random() * (target - 25)) + 11;
                    const n2 = target - n1;
                    const n3 = Math.floor(Math.random() * 80) + 15;
                    qData.nums = [n1, n2, n3].sort(() => Math.random() - 0.5);
                } else if (qData.subType === 'mul') {
                    const pairs = [[25, 4], [125, 8], [5, 20], [50, 2]];
                    const chosenPair = pairs[Math.floor(Math.random() * pairs.length)];
                    const n3 = Math.floor(Math.random() * 40) + 11;
                    qData.nums = [chosenPair[0], chosenPair[1], n3].sort(() => Math.random() - 0.5);
                } else if (qData.subType === 'sub_two') {
                    const bcTarget = (Math.floor(Math.random() * 4) + 4) * 10;
                    const b = Math.floor(Math.random() * (bcTarget - 15)) + 11;
                    const c = bcTarget - b;
                    const a = bcTarget + Math.floor(Math.random() * 100) + 35;
                    qData.nums = [a, b, c];
                } else if (qData.subType === 'sub_near') {
                    const subNum = Math.random() > 0.5 ? 99 : 98;
                    const a = Math.floor(Math.random() * 150) + 120;
                    qData.nums = [a, subNum];
                }
            } else if (mode === 'time') {
                qData.type = 'time';
                const directions = ['compound_to_small', 'small_to_compound', 'under_one_unit'];
                qData.subType = directions[Math.floor(Math.random() * directions.length)];
                if (qData.subType === 'compound_to_small') {
                    qData.unitPair = Math.random() > 0.5 ? {big: '小時', small: '分鐘', rate: 60} : {big: '分鐘', small: '秒', rate: 60};
                    if (Math.random() > 0.6) qData.unitPair = {big: '日', small: '小時', rate: 24};
                    qData.vBig = Math.floor(Math.random() * 5) + 1;
                    qData.vSmall = Math.floor(Math.random() * (qData.unitPair.rate - 5)) + 2;
                } else if (qData.subType === 'small_to_compound') {
                    qData.unitPair = Math.random() > 0.5 ? {big: '小時', small: '分鐘', rate: 60} : {big: '分鐘', small: '秒', rate: 60};
                    if (Math.random() > 0.6) qData.unitPair = {big: '日', small: '小時', rate: 24};
                    qData.totalSmall = Math.floor(Math.random() * (qData.unitPair.rate * 3)) + (qData.unitPair.rate + 5);
                } else {
                    qData.unitPair = Math.random() > 0.5 ? {big: '日', small: '小時', rate: 24} : {big: '小時', small: '分鐘', rate: 60};
                    if (Math.random() > 0.5 && qData.unitPair.big === '日') qData.unitPair = {big: '分鐘', small: '秒', rate: 60};
                    qData.totalSmall = Math.floor(Math.random() * (qData.unitPair.rate - 5)) + 3;
                }
            } else if (FACTOR_KIND_MAP[mode]) {
                Object.assign(qData, generateFactorQuestion(FACTOR_KIND_MAP[mode]));
            } else if (mode === 'fraction') {
                Object.assign(qData, generateFractionQuestion());
            } else {
                qData.type = mode === 'mix' ? (index < 4 ? 'mul' : 'div') : mode;
                qData.n1 = isZeroMode ? getTrailingZeroNum(d1) : generateNum(d1);
                qData.n2 = isZeroMode ? getTrailingZeroNum(d2) : generateNum(d2);
            }

            questions[index] = qData;
            renderAll();
        }

        // ================= 歷史快照儲存 =================
        function saveCurrentToHistory() {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const record = { id: Date.now(), time: timeStr, data: JSON.parse(JSON.stringify(questions)) };
            historyRecords.unshift(record);
            if (historyRecords.length > 8) historyRecords.pop();
            localStorage.setItem('math_snapshots', JSON.stringify(historyRecords));
            renderHistory();
        }

        function loadHistory(id) {
            const record = historyRecords.find(r => r.id === id);
            if (record) {
                questions = JSON.parse(JSON.stringify(record.data)).map(q => ({...q, show: false}));
                renderAll();
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (historyRecords.length === 0) {
                container.innerHTML = '<span class="text-indigo-300 text-sm">尚無存檔</span>';
                return;
            }
            container.innerHTML = historyRecords.map((r) => `
                <button onclick="loadHistory(${r.id})" class="text-xs bg-white text-indigo-600 border border-indigo-200 px-3 py-1.5 rounded-full hover:bg-indigo-600 hover:text-white transition shadow-sm font-bold">
                    🕒 ${r.time} 紀錄
                </button>
            `).join('');
        }

        function toggleShow(index) {
            questions[index].show = !questions[index].show;
            renderAll();
        }

        function countTrailingZeros(num) {
            const str = num.toString();
            const match = str.match(/0+$/);
            return match ? match[0].length : 0;
        }

        // ================= 各題型 HTML 渲染引擎 =================

        // 1. 簡化計算引擎 (擴充減法功能)
        function buildSimplifyHTML(q, show) {
            const nums = q.nums;
            let titleText = "";
            let stepHtml = "";
            let finalAns = 0;

            if (q.subType === 'add') {
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${nums[0]} ＋ ${nums[1]} ＋ ${nums[2]} ＝ ？</div>`;
                let p1 = 0, p2 = 1, p3 = 2;
                if ((nums[0] + nums[1]) % 10 === 0) { p1 = 0; p2 = 1; p3 = 2; }
                else if ((nums[0] + nums[2]) % 10 === 0) { p1 = 0; p2 = 2; p3 = 1; }
                else { p1 = 1; p2 = 2; p3 = 0; }
                finalAns = nums[0] + nums[1] + nums[2];
                stepHtml = `
                    <span class="text-red-600 font-bold">💡 湊整想法（交換律）：</span><br>
                    先將尾數能湊成十的組合圈起來：<br>
                    <span class="underline">${nums[p1]} ＋ ${nums[p2]} ＝ ${nums[p1] + nums[p2]}</span><br>
                    再加入第三個數：<br>
                    ${nums[p1] + nums[p2]} ＋ ${nums[p3]} ＝ <span class="text-blue-600 font-bold">${finalAns}</span>`;
            } else if (q.subType === 'mul') {
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${nums[0]} × ${nums[1]} × ${nums[2]} ＝ ？</div>`;
                let p1 = 0, p2 = 1, p3 = 2;
                const checkPair = (a, b) => (a*b===100 || a*b===1000 || a*b===10 || a*b===40);
                if (checkPair(nums[0], nums[1])) { p1 = 0; p2 = 1; p3 = 2; }
                else if (checkPair(nums[0], nums[2])) { p1 = 0; p2 = 2; p3 = 1; }
                else { p1 = 1; p2 = 2; p3 = 0; }
                finalAns = nums[0] * nums[1] * nums[2];
                stepHtml = `
                    <span class="text-red-600 font-bold">💡 湊整想法（結合律）：</span><br>
                    先找乘法好朋友組合：<br>
                    <span class="underline">${nums[p1]} × ${nums[p2]} ＝ ${nums[p1] * nums[p2]}</span><br>
                    接著計算：<br>
                    ${nums[p1] * nums[p2]} × ${nums[p3]} ＝ <span class="text-blue-600 font-bold">${finalAns}</span>`;
            } else if (q.subType === 'sub_two') {
                // 連減法：A - B - C = A - (B + C)
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${nums[0]} － ${nums[1]} － ${nums[2]} ＝ ？</div>`;
                finalAns = nums[0] - nums[1] - nums[2];
                stepHtml = `
                    <span class="text-red-600 font-bold">💡 連減想法（去括號法則）：</span><br>
                    連續減去兩個數，等於【減去這兩數的和】：<br>
                    式子變成：${nums[0]} － <span class="underline">(${nums[1]} ＋ ${nums[2]})</span><br>
                    ＝ ${nums[0]} － ${nums[1] + nums[2]}<br>
                    ＝ <span class="text-blue-600 font-bold">${finalAns}</span>`;
            } else if (q.subType === 'sub_near') {
                // 接近整百：A - 99 = A - 100 + 1
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${nums[0]} － ${nums[1]} ＝ ？</div>`;
                finalAns = nums[0] - nums[1];
                let adjust = nums[1] === 99 ? 1 : 2;
                stepHtml = `
                    <span class="text-red-600 font-bold">💡 接近整百速算：</span><br>
                    把 －${nums[1]} 當作先減去 100，再【加回 ${adjust}】！<br>
                    式子變成：${nums[0]} － 100 ＋ ${adjust}<br>
                    ＝ ${nums[0] - 100} ＋ ${adjust}<br>
                    ＝ <span class="text-blue-600 font-bold">${finalAns}</span>`;
            }

            return `
                <div class="w-full flex flex-col items-center">
                    ${titleText}
                    <div class="${show ? 'detail-show' : 'detail-hidden'} w-full mt-2">
                        <div class="text-xs text-left bg-emerald-50 text-emerald-900 border border-emerald-200 p-3 rounded-lg leading-relaxed font-sans">
                            ${stepHtml}
                        </div>
                    </div>
                    <div class="mt-auto pt-4 text-center text-blue-600 font-bold text-xl ${show ? 'opacity-100' : 'opacity-0'}">＝ ${finalAns}</div>
                </div>`;
        }

        // 2. 時間換算引擎 (全面擴充複名數、未滿一日/時/分題型)
        function buildTimeHTML(q, show) {
            let titleText = "";
            let stepHtml = "";
            let finalAnsText = "";

            if (q.subType === 'compound_to_small') {
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${q.vBig} ${q.unitPair.big} ${q.vSmall} ${q.unitPair.small} ＝ (   ) ${q.unitPair.small}</div>`;
                const calculated = q.vBig * q.unitPair.rate;
                finalAnsText = `${calculated + q.vSmall} ${q.unitPair.small}`;
                stepHtml = `
                    <span class="text-red-600 font-bold">💡 複名數拆解（大變小）：</span><br>
                    先將大單位換算出來：<br>
                    ${q.vBig} ${q.unitPair.big} ＝ ${q.unitPair.rate} × ${q.vBig} ＝ ${calculated} ${q.unitPair.small}<br>
                    最後加上原本的：<br>
                    ${calculated} ＋ ${q.vSmall} ＝ <span class="text-blue-600 font-bold">${calculated + q.vSmall}</span> ${q.unitPair.small}`;
            } else if (q.subType === 'small_to_compound') {
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${q.totalSmall} ${q.unitPair.small} ＝ (   ) ${q.unitPair.big} (   ) ${q.unitPair.small}</div>`;
                const bigVal = Math.floor(q.totalSmall / q.unitPair.rate);
                const smallVal = q.totalSmall % q.unitPair.rate;
                finalAnsText = `${bigVal} ${q.unitPair.big} ${smallVal} ${q.unitPair.small}`;
                stepHtml = `
                    <span class="text-red-600 font-bold">💡 複名數歸納（小變大）：</span><br>
                    每 ${q.unitPair.rate} ${q.unitPair.small} 可以進位成 1 ${q.unitPair.big}。<br>
                    算式：${q.totalSmall} ÷ ${q.unitPair.rate} ＝ ${bigVal} ... ${smallVal}<br>
                    商數就是【${q.unitPair.big}】，餘數就是剩下來的【${q.unitPair.small}】。`;
            } else if (q.subType === 'under_one_unit') {
                // 特殊：未滿一日/時/分
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${q.totalSmall} ${q.unitPair.small} ＝ (   ) ${q.unitPair.big} (   ) ${q.unitPair.small}</div>`;
                finalAnsText = `0 ${q.unitPair.big} ${q.totalSmall} ${q.unitPair.small}`;
                stepHtml = `
                    <span class="text-red-600 font-bold">💡 教學核心：未滿一單位</span><br>
                    因為總數 <span class="text-red-600 font-bold">${q.totalSmall}</span> 小於進位標準 ${q.unitPair.rate}，不夠換成 1 ${q.unitPair.big}！<br>
                    算式：${q.totalSmall} ÷ ${q.unitPair.rate} ＝ <span class="text-blue-600 font-bold">0</span> ... <span class="text-blue-600 font-bold">${q.totalSmall}</span><br>
                    因此換算結果為：<span class="font-bold">0 ${q.unitPair.big}</span> 剩餘 <span class="font-bold">${q.totalSmall} ${q.unitPair.small}</span>。`;
            }

            return `
                <div class="w-full flex flex-col items-center">
                    ${titleText}
                    <div class="${show ? 'detail-show' : 'detail-hidden'} w-full mt-2">
                        <div class="text-xs text-left bg-amber-50 text-amber-950 border border-amber-200 p-3 rounded-lg leading-relaxed font-sans">
                            ${stepHtml}
                        </div>
                    </div>
                    <div class="mt-auto pt-4 text-center text-blue-600 font-bold text-xl ${show ? 'opacity-100' : 'opacity-0'}">＝ ${finalAnsText}</div>
                </div>`;
        }

        // 題目區橫式提示 (鷹架)：只列算式、答案留空，勾選才顯示
        function buildFactorScaffold(q) {
            const box = document.getElementById('hintCheck');
            if (!box || !box.checked) return "";
            const blank = '<span class="inline-block w-10 border-b border-gray-400 align-bottom">&nbsp;</span>';
            const list = (label, n, op, upTo, cols) => {
                let rows = "";
                for (let i = 1; i <= upTo; i++) rows += `<div>${n}${op}${i}＝${blank}</div>`;
                return `<div><div class="font-bold text-gray-500 mb-1">${label}</div><div class="grid ${cols} gap-x-3 gap-y-1 font-mono">${rows}</div></div>`;
            };
            let inner = "";
            if (q.subType === 'factors') {
                inner = list(`提示：哪些數可以整除 ${q.n}？（先試前幾個，寫出商與餘數）`, q.n, '÷', 5, 'grid-cols-2');
            } else if (q.subType === 'multiples') {
                inner = list(`提示：${q.n} × 幾？（先寫前幾個）`, q.n, '×', 5, 'grid-cols-2');
            } else if (q.subType === 'common_factors') {
                inner = `<div class="font-bold text-gray-500 mb-1">提示：哪些數可以同時整除 ${q.a} 和 ${q.b}？</div><div class="grid grid-cols-2 gap-3">${list(`${q.a} ÷ 幾`, q.a, '÷', 5, 'grid-cols-1')}${list(`${q.b} ÷ 幾`, q.b, '÷', 5, 'grid-cols-1')}</div>`;
            } else {
                inner = `<div class="grid grid-cols-2 gap-3">${list(`${q.a} × 幾`, q.a, '×', 5, 'grid-cols-1')}${list(`${q.b} × 幾`, q.b, '×', 5, 'grid-cols-1')}</div>`;
            }
            return `<div class="w-full text-xs bg-white border border-dashed border-violet-300 rounded-lg p-2 mt-1">${inner}</div>`;
        }

        // 3. 因數／倍數／公因數／公倍數引擎 (含乘除法算式輔助)
        function buildFactorHTML(q, show) {
            let titleText = "";
            let aidHtml = "";
            let answerHtml = "";

            if (q.subType === 'factors') {
                const n = q.n;
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${n} 的因數有哪些？</div>`;
                const factors = [];
                let rows = "";
                for (let i = 1; i <= n; i++) {
                    if (n % i === 0) {
                        factors.push(i);
                        rows += `<div class="text-emerald-700 font-bold">${n}÷${i}＝${n / i} ✓</div>`;
                    } else {
                        rows += `<div class="text-gray-400">${n}÷${i}＝${Math.floor(n / i)}...${n % i}</div>`;
                    }
                }
                aidHtml = `
                    <span class="text-red-600 font-bold">💡 輔助算式（逐一測試除法，整除的就是因數）：</span>
                    <div class="grid grid-cols-3 gap-x-2 gap-y-0.5 mt-2 font-mono">${rows}</div>`;
                answerHtml = `${factors.join('、')}（共 ${factors.length} 個）`;
            } else if (q.subType === 'multiples') {
                const n = q.n, count = q.count;
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${n} 的倍數有哪些？(請寫出前 ${count} 個)</div>`;
                const mults = [];
                let rows = "";
                for (let i = 1; i <= count; i++) {
                    mults.push(n * i);
                    rows += `<div class="text-emerald-700 font-bold">${n}×${i}＝${n * i}</div>`;
                }
                aidHtml = `
                    <span class="text-red-600 font-bold">💡 輔助算式（用乘法依序找倍數）：</span>
                    <div class="grid grid-cols-2 gap-x-2 gap-y-0.5 mt-2 font-mono">${rows}</div>`;
                answerHtml = `${mults.join('、')}`;
            } else if (q.subType === 'common_factors') {
                const a = q.a, b = q.b;
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${a} 和 ${b} 的公因數有哪些？</div>`;
                const factorsA = [], factorsB = [];
                let rowsA = "", rowsB = "";
                for (let i = 1; i <= a; i++) {
                    if (a % i === 0) { factorsA.push(i); rowsA += `<div class="text-emerald-700 font-bold">${a}÷${i}＝${a / i} ✓</div>`; }
                    else { rowsA += `<div class="text-gray-400">${a}÷${i}＝${Math.floor(a / i)}...${a % i}</div>`; }
                }
                for (let i = 1; i <= b; i++) {
                    if (b % i === 0) { factorsB.push(i); rowsB += `<div class="text-emerald-700 font-bold">${b}÷${i}＝${b / i} ✓</div>`; }
                    else { rowsB += `<div class="text-gray-400">${b}÷${i}＝${Math.floor(b / i)}...${b % i}</div>`; }
                }
                const common = factorsA.filter(x => factorsB.includes(x));
                const g = gcdCalc(a, b);
                aidHtml = `
                    <span class="text-red-600 font-bold">💡 輔助算式（分別列出兩數的除法算式）：</span>
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <div><div class="font-bold text-gray-600 mb-1">${a} 的因數：</div><div class="font-mono">${rowsA}</div></div>
                        <div><div class="font-bold text-gray-600 mb-1">${b} 的因數：</div><div class="font-mono">${rowsB}</div></div>
                    </div>
                    <div class="mt-2">兩邊都整除的數字就是【公因數】，其中最大的稱為<span class="font-bold">最大公因數(GCD)</span>。</div>`;
                answerHtml = `${common.join('、')}（最大公因數為 ${g}）`;
            } else {
                const a = q.a, b = q.b, count = q.count;
                const l = lcmCalc(a, b);
                titleText = `<div class="text-base font-bold text-gray-700 mb-2">${a} 和 ${b} 的公倍數有哪些？(請寫出前 ${count} 個)</div>`;
                const limit = l * count;
                let rowsA = "", rowsB = "";
                for (let i = 1; a * i <= limit; i++) {
                    const isCommon = (a * i) % l === 0;
                    rowsA += `<div class="${isCommon ? 'text-emerald-700 font-bold' : 'text-gray-400'}">${a}×${i}＝${a * i}${isCommon ? ' ✓' : ''}</div>`;
                }
                for (let i = 1; b * i <= limit; i++) {
                    const isCommon = (b * i) % l === 0;
                    rowsB += `<div class="${isCommon ? 'text-emerald-700 font-bold' : 'text-gray-400'}">${b}×${i}＝${b * i}${isCommon ? ' ✓' : ''}</div>`;
                }
                const commons = [];
                for (let i = 1; i <= count; i++) commons.push(l * i);
                aidHtml = `
                    <span class="text-red-600 font-bold">💡 輔助算式（分別列出兩數的乘法算式）：</span>
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <div><div class="font-bold text-gray-600 mb-1">${a} 的倍數：</div><div class="font-mono">${rowsA}</div></div>
                        <div><div class="font-bold text-gray-600 mb-1">${b} 的倍數：</div><div class="font-mono">${rowsB}</div></div>
                    </div>
                    <div class="mt-2">兩邊都出現的數字就是【公倍數】，其中最小的稱為<span class="font-bold">最小公倍數(LCM)</span>。</div>`;
                answerHtml = `${commons.join('、')}（最小公倍數為 ${l}）`;
            }

            return `
                <div class="w-full flex flex-col items-center">
                    ${titleText}
                    ${buildFactorScaffold(q)}
                    <div class="${show ? 'detail-show' : 'detail-hidden'} w-full mt-2">
                        <div class="text-xs text-left bg-violet-50 text-violet-950 border border-violet-200 p-3 rounded-lg leading-relaxed font-sans">
                            ${aidHtml}
                        </div>
                    </div>
                    <div class="mt-auto pt-4 text-center text-blue-600 font-bold text-base ${show ? 'opacity-100' : 'opacity-0'}">＝ ${answerHtml}</div>
                </div>`;
        }

        // 4. 分數加減 (異分母通分) 引擎
        function fracHTML(num, den) {
            return `<div class="flex flex-col items-center leading-none">
                <span class="px-1">${num}</span>
                <span class="w-full border-t-2 border-current my-0.5"></span>
                <span class="px-1">${den}</span>
            </div>`;
        }

        function buildFractionHTML(q, show) {
            const { n1, d1, n2, d2, op } = q;
            const l = lcmCalc(d1, d2);
            const c1 = n1 * (l / d1);
            const c2 = n2 * (l / d2);
            const resultNum = op === '+' ? c1 + c2 : c1 - c2;
            const g = gcdCalc(Math.abs(resultNum), l);
            const simpNum = resultNum / g;
            const simpDen = l / g;

            const titleText = `
                <div class="flex items-center gap-3 text-xl font-bold text-gray-700 mb-2">
                    ${fracHTML(n1, d1)}
                    <span>${op === '+' ? '＋' : '－'}</span>
                    ${fracHTML(n2, d2)}
                    <span>＝</span>
                    <span>?</span>
                </div>`;

            const aidHtml = `
                <span class="text-red-600 font-bold">💡 異分母加減：先通分（找分母的最小公倍數）</span><br>
                ${d1} 和 ${d2} 的最小公倍數 ＝ ${l}<br>
                通分：${n1}/${d1} ＝ ${c1}/${l}　，　${n2}/${d2} ＝ ${c2}/${l}<br>
                計算：${c1} ${op} ${c2} ＝ ${resultNum}<br>
                所以 ${resultNum}/${l}${g > 1 ? `，約分（分子分母同除以 ${g}）＝ <span class="text-blue-600 font-bold">${simpNum}/${simpDen}</span>` : ''}`;

            const answerText = simpDen === 1 ? `${simpNum}` : `${simpNum}/${simpDen}`;

            return `
                <div class="w-full flex flex-col items-center">
                    ${titleText}
                    <div class="${show ? 'detail-show' : 'detail-hidden'} w-full mt-2">
                        <div class="text-xs text-left bg-cyan-50 text-cyan-950 border border-cyan-200 p-3 rounded-lg leading-relaxed font-sans">
                            ${aidHtml}
                        </div>
                    </div>
                    <div class="mt-auto pt-4 text-center text-blue-600 font-bold text-xl ${show ? 'opacity-100' : 'opacity-0'}">＝ ${answerText}</div>
                </div>`;
        }

        // 5. 常規直式：乘法引擎 (頂部進位)
        function buildMulHTML(n1, n2, show) {
            const n1Str = n1.toString();
            const n2Str = n2.toString();
            const ansStr = (n1 * n2).toString();
            const width = Math.max(n1Str.length, n2Str.length + 2, ansStr.length);
            
            const z1 = countTrailingZeros(n1);
            const z2 = countTrailingZeros(n2);
            let simplifyTip = "";
            if (z1 > 0 || z2 > 0) {
                const sN1 = n1 / Math.pow(10, z1);
                const sN2 = n2 / Math.pow(10, z2);
                simplifyTip = `<div class="mt-3 text-xs bg-emerald-50 text-emerald-800 p-2 rounded border border-emerald-100 font-bold whitespace-normal leading-normal">💡 簡化想法：先算 ${sN1} × ${sN2} ＝ ${sN1 * sN2}，最後尾數再補上 ${z1 + z2} 個 0。</div>`;
            }

            let carryHTML = "";
            let detail = "";
            const s2 = n2Str.split('').reverse();
            let validSteps = 0;
            
            for(let i=0; i<s2.length; i++) {
                if(s2[i] !== '0') {
                    const digitB = parseInt(s2[i]);
                    const product = n1 * digitB;
                    const prodStr = product.toString();
                    
                    let carryArr = new Array(n1Str.length).fill(" ");
                    let currentCarry = 0;
                    for (let k = n1Str.length - 1; k >= 0; k--) {
                        let digitA = parseInt(n1Str[k]);
                        let prod = digitA * digitB + currentCarry;
                        let nextCarry = Math.floor(prod / 10);
                        if (k - 1 >= 0 && nextCarry > 0) {
                            carryArr[k - 1] = nextCarry.toString();
                        }
                        currentCarry = nextCarry;
                    }
                    let carryStr = carryArr.join('');
                    
                    if (carryStr.trim().length > 0) {
                       let padLeft = width - n1Str.length;
                       carryHTML = `<div class="text-red-500 font-bold">` + " ".repeat(Math.max(0, padLeft)) + carryStr + `</div>` + carryHTML;
                    }
                    
                    const padLeft = width - i - prodStr.length;
                    detail += " ".repeat(Math.max(0, padLeft)) + prodStr + " ".repeat(i) + "\n";
                    validSteps++;
                }
            }
            
            let carryContainer = carryHTML !== "" ? `<div class="${show ? 'detail-show' : 'detail-hidden'}">${carryHTML}</div>` : "";
            let baseMath = `<div>` + " ".repeat(width - n1Str.length) + n1Str + "\n" + " ".repeat(width - n2Str.length - 2) + "× " + n2Str + "\n" + "-".repeat(width) + `</div>`;
            
            if (validSteps > 1) {
                detail += "-".repeat(width) + "\n";
                detail += `<span class="text-blue-600 font-bold">` + " ".repeat(width - ansStr.length) + ansStr + `</span>\n`;
            } else {
                detail += `<span class="text-blue-600 font-bold">` + " ".repeat(width - ansStr.length) + ansStr + `</span>\n`;
            }

            return `<div class="math-font flex flex-col w-full px-2"><div class="text-left">${carryContainer}${baseMath}<div class="${show ? 'detail-show' : 'detail-hidden'} text-gray-600">${detail}</div></div>${show ? simplifyTip : ''}</div>`;
        }

        // 6. 常規直式：除法引擎
        function buildDivHTML(n1, n2, show) {
            const q = Math.floor(n1 / n2).toString();
            const r = n1 % n2;
            const n1Str = n1.toString();
            const n2Str = n2.toString();
            const preLen = n2Str.length + 3; 
            
            const z1 = countTrailingZeros(n1);
            const z2 = countTrailingZeros(n2);
            let simplifyTip = "";
            if (z1 > 0 && z2 > 0) {
                const commonZeros = Math.min(z1, z2);
                const sN1 = n1 / Math.pow(10, commonZeros);
                const sN2 = n2 / Math.pow(10, commonZeros);
                const sR = sN1 % sN2;
                let rTip = r > 0 ? `，簡化餘數 ${sR} 要放大 ${Math.pow(10, commonZeros)} 倍變成實質餘數 ${r}` : "（剛好整除）";
                simplifyTip = `<div class="mt-3 text-xs bg-amber-50 text-amber-800 p-2 rounded border border-amber-100 font-bold whitespace-normal leading-normal">💡 簡化想法：被除數與除數同時劃掉 ${commonZeros} 個 0，變成算 ${sN1} ÷ ${sN2}${rTip}。</div>`;
            }

            let outTop = "";
            const qPad = preLen + n1Str.length - q.length;
            outTop += `<div class="${show ? 'opacity-100' : 'opacity-0'} text-blue-600 font-bold transition-opacity">` + " ".repeat(qPad) + q + "</div>";
            
            let outBase = "";
            outBase += " ".repeat(preLen) + "-".repeat(n1Str.length) + "\n";
            outBase += n2Str + " ) " + n1Str + "\n";
            
            let detail = "";
            let cv = "";
            let stepsCount = 0;
            
            for (let i = 0; i < n1Str.length; i++) {
                cv += n1Str[i];
                let cvNum = parseInt(cv, 10);
                
                if (cvNum >= n2 || (i === n1Str.length - 1 && stepsCount > 0)) {
                    let sub = Math.floor(cvNum / n2) * n2;
                    if (sub > 0 || i === n1Str.length - 1) {
                        let subStr = sub.toString();
                        if (sub > 0) {
                            let subPad = preLen + i + 1 - subStr.length;
                            detail += " ".repeat(subPad) + subStr + "\n";
                            let dashLen = Math.max(cv.length, subStr.length);
                            let dashPad = preLen + i + 1 - dashLen;
                            detail += " ".repeat(dashPad) + "-".repeat(dashLen) + "\n";
                            cv = (cvNum - sub).toString();
                            if (cv === "0") cv = ""; 
                        }
                        
                        if (i < n1Str.length - 1) {
                            let displayCv = cv + n1Str[i+1];
                            let dropPad = preLen + i + 2 - displayCv.length;
                            detail += " ".repeat(dropPad) + displayCv + "\n";
                            stepsCount++;
                        } else {
                            let displayCv = cv === "" ? "0" : cv;
                            let remPad = preLen + i + 1 - displayCv.length;
                            detail += " ".repeat(remPad) + displayCv + "\n";
                        }
                    }
                } else if (i < n1Str.length - 1 && stepsCount > 0) {
                     let displayCv = parseInt(cv + n1Str[i+1], 10).toString(); 
                     let dropPad = preLen + i + 2 - displayCv.length;
                     detail += " ".repeat(dropPad) + displayCv + "\n";
                }
            }

            if (r > 0) {
                detail += `\n<span class="text-amber-600 font-bold text-xs"> (餘數為 ${r})</span>`;
            }

            return `<div class="math-font flex flex-col w-full px-2"><div class="text-left">${outTop}${outBase}<div class="${show ? 'detail-show' : 'detail-hidden'} text-gray-600">${detail}</div></div>${show ? simplifyTip : ''}</div>`;
        }

        // ================= 畫面渲染主引擎 =================
        function renderAll() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                let mathContent = "";
                let typeLabel = "";

                if (q.type === 'simplify') {
                    mathContent = buildSimplifyHTML(q, q.show);
                    if (q.subType === 'add') typeLabel = '加法簡化';
                    else if (q.subType === 'mul') typeLabel = '乘法簡化';
                    else if (q.subType === 'sub_two') typeLabel = '減法簡化(連減)';
                    else if (q.subType === 'sub_near') typeLabel = '減法簡化(補數)';
                } else if (q.type === 'time') {
                    mathContent = buildTimeHTML(q, q.show);
                    if (q.subType === 'compound_to_small') typeLabel = '時間：複名數換算';
                    else if (q.subType === 'small_to_compound') typeLabel = '時間：單位進位';
                    else if (q.subType === 'under_one_unit') typeLabel = '時間：未滿一單位';
                } else if (q.type === 'factor') {
                    mathContent = buildFactorHTML(q, q.show);
                    if (q.subType === 'factors') typeLabel = '因數';
                    else if (q.subType === 'multiples') typeLabel = '倍數';
                    else if (q.subType === 'common_factors') typeLabel = '公因數';
                    else if (q.subType === 'common_multiples') typeLabel = '公倍數';
                } else if (q.type === 'fraction') {
                    mathContent = buildFractionHTML(q, q.show);
                    typeLabel = q.op === '+' ? '分數加法(異分母)' : '分數減法(異分母)';
                } else if (q.type === 'mul') {
                    mathContent = buildMulHTML(q.n1, q.n2, q.show);
                    typeLabel = '乘法直式';
                } else if (q.type === 'div') {
                    mathContent = buildDivHTML(q.n1, q.n2, q.show);
                    typeLabel = '除法直式';
                }
                
                const cardHtml = `
                    <div onclick="toggleShow(${index})" class="bg-white border border-gray-200 rounded-xl p-5 min-h-[420px] shadow-sm hover:border-blue-400 hover:shadow-md transition-all cursor-pointer flex flex-col relative group">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-4">
                            <span class="text-blue-600 font-bold text-sm bg-blue-50 border border-blue-100 px-2 py-1 rounded shadow-sm">${q.label} [${typeLabel}]</span>
                            <button onclick="refreshOne(event, ${index})" class="text-gray-400 hover:text-blue-600 hover:bg-gray-100 p-1.5 rounded transition opacity-0 group-hover:opacity-100" title="單獨更換此題數字">🔄</button>
                        </div>
                        
                        <div class="flex-1 flex justify-center w-full items-start mt-2">
                            ${mathContent}
                        </div>

                        <div class="mt-4 pt-3 border-t border-gray-50 text-center text-xs text-gray-400">
                            點擊卡片顯示詳細思維解法
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }
    </script>
</body>
</html>
