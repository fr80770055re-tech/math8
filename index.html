<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業繳交小幫手 - 綜合數學出題</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: {
            sans: ["Noto Sans TC", "system-ui", "sans-serif"],
            mono: ["IBM Plex Mono", "Noto Sans TC", "ui-monospace", "monospace"]
        } } } };
    </script>

    <style>

        .answer-row { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 0.75rem; width: 100%; }
        .answer-q { min-width: 0; flex: 0 1 auto; }
        .answer-a { font-family: 'IBM Plex Mono', 'Noto Sans TC', ui-monospace, monospace; flex: 0 1 auto; min-width: 0; margin-left: auto; text-align: right; font-weight: 700; color: #c2410c; font-size: 1.15rem; line-height: 1.3; overflow-wrap: anywhere; }

        /* ===== A4 直式列印 ===== */
        #printArea { display: none; }
        @page { size: A4 portrait; margin: 12mm; }
        @media print {
            body { background: #fff !important; min-height: 0 !important; display: block !important; }
            body > *:not(main), main > *:not(#printArea) { display: none !important; }
            main { display: block; max-width: none; padding: 0; margin: 0; }
            #printArea { display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact; color: #1c1917; }
            .print-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12mm; padding-bottom: 3mm; margin-bottom: 5mm; border-bottom: 1px solid #78716c; font-size: 12pt; }
            .print-head h2 { font-size: 15pt; font-weight: 700; }
            .print-fill { flex: 1; text-align: right; white-space: nowrap; }
            .print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
            .print-cell { break-inside: avoid; border: 1px solid #a8a29e; border-radius: 2mm; padding: 4mm; min-height: 58mm; display: flex; flex-direction: column; }
            .print-cell .print-label { font-size: 10pt; font-weight: 700; margin-bottom: 3mm; }
            .print-cell .math-font { font-size: 15pt; }
            .print-cell .q-title { font-size: 13pt; }
            .print-cell .print-body { flex: 1; display: flex; justify-content: center; align-items: flex-start; }
        }
        @media (prefers-reduced-motion: reduce) { .detail-show { animation: none; } }
        :root {
            --paper: #f4edda;
            --sheet: #fffdf5;
        }
        .math-font {
            font-family: 'IBM Plex Mono', 'Noto Sans TC', ui-monospace, monospace;
            font-weight: 500;
            font-size: 1.6rem;
            line-height: 1.3;
            letter-spacing: 0;
            white-space: pre;
        }
        .q-title { font-family: 'IBM Plex Mono', 'Noto Sans TC', ui-monospace, monospace; font-weight: 600; font-size: 1.35rem; line-height: 1.5; color: #44403c; }
        .q-title-lg { font-size: 1.5rem; }
        body { margin: 0; overflow-x: hidden; background-color: var(--paper); }
        /* 一張 A4 比例的題目紙：2 欄 × 4 列 */
        .sheet {
            background-color: var(--sheet);
            border: 1px solid #d6d3d1;
            box-shadow: 0 1px 2px rgba(80, 60, 20, 0.12), 0 6px 14px -8px rgba(80, 60, 20, 0.3);
            padding: 1.25rem;
            max-width: 52rem;
            margin-inline: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        @media (min-width: 1024px) { .sheet { aspect-ratio: 210 / 297; padding: 1.75rem; } }
        .sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.5rem 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #78716c; color: #292524; }
        .sheet-head h2 { font-size: 1.2rem; font-weight: 700; }
        .sheet-head span { font-size: 0.95rem; color: #57534e; white-space: nowrap; }
        .sheet-grid { flex: 1; display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
        @media (min-width: 640px) { .sheet-grid { grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; } }
        .cell { border: 1px solid #a8a29e; border-radius: 0.5rem; padding: 0.9rem; display: flex; flex-direction: column; min-width: 0; transition: border-color .15s; }
        .cell:hover { border-color: #ea580c; }
        
        .detail-hidden { display: none; }
        .detail-show { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 font-sans flex flex-col min-h-screen" onload="initApp()">

    <header class="bg-[#fffdf5] text-stone-800 border-b border-stone-300 px-6 py-4">
        <h1 class="text-xl font-bold tracking-wider">作業繳交小幫手</h1>
        <p class="text-sm text-stone-600 mt-0.5">選題型 → 重新出題 → 列印題目，學生把題目抄進8格本。</p>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-1">
        <div class="flex flex-col gap-6 lg:grid lg:grid-cols-[19rem_minmax(0,1fr)] lg:gap-8 lg:items-start">

            <aside aria-label="出題設定" class="lg:sticky lg:top-4 bg-[#fffdf5] rounded-xl border border-stone-300 shadow-sm">
                <div class="p-5 flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <label for="modeSelect" class="text-stone-700 font-bold text-sm">題型</label>
                        <select id="modeSelect" class="border border-stone-300 bg-white rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-orange-500">
<optgroup label="基礎直式">
    <option value="mix" data-short="乘除混合" data-desc="乘法與除法各 4 題。">混合 (乘除各半)</option>
    <option value="mul" data-short="乘法" data-desc="8 題直式乘法。">純乘法</option>
    <option value="div" data-short="除法" data-desc="8 題直式除法，被除數一定不小於除數。">純除法</option>
</optgroup>
<optgroup label="特別單元">
    <option value="simplify" data-short="簡化計算" data-desc="四則運算與減法湊整的速算。">簡化計算</option>
    <option value="time" data-short="時間換算" data-desc="複名數與日、時、分、秒的進退位。">時間換算</option>
    <option value="factors" data-short="因數" data-desc="找出一個數的所有因數。">因數</option>
    <option value="multiples" data-short="倍數" data-desc="依序寫出一個數的倍數。">倍數</option>
    <option value="commonFactor" data-short="公因數" data-desc="找出兩個數的公因數與最大公因數。">公因數</option>
    <option value="commonMultiple" data-short="公倍數" data-desc="找出兩個數的公倍數與最小公倍數。">公倍數</option>
    <option value="factorMix" data-short="因數倍數混合" data-desc="因數題的數在 60 以內，倍數題的數在 19 以內。">因數倍數混合</option>
    <option value="factorRange" data-short="限範圍因數倍數" data-desc="例如：在 15 至 20 之間的 45 的因數。">限定範圍的因數倍數</option>
    <option value="fraction" data-short="分數加減" data-desc="異分母分數加減，需要先通分。">分數加減 (異分母)</option>
</optgroup>
                        </select>
                        <p id="modeDesc" class="text-sm text-stone-600"></p>
                    </div>
                    <div id="digitSettings" class="flex items-end gap-2 text-stone-700 font-bold text-sm">
                        <div class="flex flex-col gap-1 flex-1">
                            <label for="d1Select">被乘數／被除數</label>
                            <select id="d1Select" class="border border-stone-300 bg-white rounded-md px-2 py-2">
                                <option value="3">3位</option><option value="4">4位</option><option value="5">5位</option>
                            </select>
                        </div>
                        <span class="pb-2 text-lg" aria-hidden="true">×÷</span>
                        <div class="flex flex-col gap-1 flex-1">
                            <label for="d2Select">乘數／除數</label>
                            <select id="d2Select" class="border border-stone-300 bg-white rounded-md px-2 py-2">
                                <option value="1">1位</option><option value="2" selected>2位</option><option value="3">3位</option>
                            </select>
                        </div>
                    </div>
                    <div id="zeroSettings" class="flex items-center gap-2 text-stone-800 font-bold text-sm">
                        <input type="checkbox" id="zeroCheck" class="w-5 h-5 cursor-pointer accent-orange-700">
                        <label for="zeroCheck" class="cursor-pointer select-none">尾數含 0（速算練習）</label>
                    </div>
                    <div id="hintSettings" style="display:none" class="flex items-center gap-2 text-stone-800 font-bold text-sm">
                        <input type="checkbox" id="hintCheck" class="w-5 h-5 cursor-pointer accent-orange-700" onchange="renderAll()">
                        <label for="hintCheck" class="cursor-pointer select-none">附橫式提示（鷹架，不含答案）</label>
                    </div>

                    <button onclick="regenerateWithUndo()" class="bg-orange-700 hover:bg-orange-800 text-white px-6 py-2.5 rounded-md font-bold transition">重新出題（8題）</button>
                    <div class="flex flex-col gap-1">
                        <button onclick="printSheet('questions')" class="bg-white text-orange-900 border border-orange-400 hover:bg-orange-50 px-4 py-2.5 rounded-md font-bold transition">列印題目（A4）</button>
                        <button id="printAnswersBtn" onclick="printSheet('answers')" style="display:none" class="text-sm font-bold text-orange-900 hover:bg-orange-50 px-4 min-h-[40px] rounded-md transition">列印答案卷</button>
                    </div>
                </div>

                <div class="border-t border-stone-300 p-5 flex flex-col gap-3">
                    <div class="flex items-center gap-2 text-stone-800 font-bold text-sm">
                        <input type="checkbox" id="teacherCheck" class="w-5 h-5 cursor-pointer accent-orange-700">
                        <label for="teacherCheck" class="cursor-pointer select-none">老師模式（顯示解答、單題換題、答案卷）</label>
                    </div>
                    <p class="text-sm text-stone-600">關閉時，畫面上看不到任何解答。</p>
                </div>

                <div class="border-t border-stone-300 p-5 flex flex-col gap-3">
                    <h2 class="text-sm text-stone-700 font-bold">我的題組<span class="font-normal text-stone-600">（最多 8 組）</span></h2>
                    <button onclick="saveCurrentToHistory()" class="bg-stone-700 hover:bg-stone-800 text-white px-4 min-h-[40px] rounded-md text-sm font-bold transition">儲存目前這組</button>
                    <div id="historyContainer" class="flex flex-col gap-2 items-start"></div>
                    <div id="saveStatus" role="status" class="text-sm text-stone-700 font-bold"></div>
                </div>
            </aside>

            <section aria-label="題目頁面" class="min-w-0">
                <div class="sheet">
                    <div id="sheetHead" class="sheet-head"></div>
                    <div id="quizContainer" class="sheet-grid"></div>
                </div>
            </section>
        </div>
        <div id="printArea" aria-hidden="true"></div>
    </main>

    <script>
        let questions = [];
        // 瀏覽器儲存空間可能被封鎖或內容損毀：讀寫都不能讓頁面壞掉
        function storageGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function storageSet(key, value) {
            try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
        }
        function readHistory() {
            try {
                const parsed = JSON.parse(storageGet('math_snapshots') || '[]');
                return Array.isArray(parsed)
                    ? parsed.filter(r => r && typeof r.id === 'number' && Array.isArray(r.data))
                    : [];
            } catch (e) { return []; }
        }
        let historyRecords = readHistory();

        // 老師模式：關閉時畫面上完全沒有解答、換題與答案卷的入口
        let teacherMode = storageGet('math_teacher') === '1';

        function applyTeacherUI() {
            document.getElementById('teacherCheck').checked = teacherMode;
            document.getElementById('printAnswersBtn').style.display = teacherMode ? 'block' : 'none';
        }

        function setTeacherMode(on) {
            teacherMode = on;
            storageSet('math_teacher', on ? '1' : '0');
            if (!on) questions.forEach(q => { q.show = false; });
            applyTeacherUI();
            renderAll();
        }

        // 例如「乘法 3位×2位」；只有直式乘除才有位數
        function modeDigitsLabel(mode, d1, d2) {
            const name = modeShortName(mode);
            const digits = (['mix', 'mul', 'div'].includes(mode) && d1 && d2)
                ? ` ${d1}位${mode === 'div' ? '÷' : mode === 'mul' ? '×' : '×÷'}${d2}位` : '';
            return name + digits;
        }

        function renderSheetHead() {
            const { mode, d1, d2 } = currentSettings();
            document.getElementById('sheetHead').innerHTML =
                `<h2>數學練習・${modeDigitsLabel(mode, d1, d2)}</h2><span>班級：______　姓名：______　日期：______</span>`;
        }

        const NO_DIGIT_MODES = ['simplify', 'time', 'factors', 'multiples', 'commonFactor', 'commonMultiple', 'factorMix', 'factorRange', 'fraction'];
        const FACTOR_MODES = ['factors', 'multiples', 'commonFactor', 'commonMultiple', 'factorMix', 'factorRange'];

        // 依題型顯示／隱藏相關設定，並更新說明
        function applyModeUI(val) {
            const showDigits = !NO_DIGIT_MODES.includes(val);
            document.getElementById('digitSettings').style.display = showDigits ? 'flex' : 'none';
            document.getElementById('zeroSettings').style.display = showDigits ? 'flex' : 'none';
            document.getElementById('hintSettings').style.display = FACTOR_MODES.includes(val) ? 'flex' : 'none';
            const opt = document.querySelector(`#modeSelect option[value="${val}"]`);
            document.getElementById('modeDesc').textContent = opt ? opt.dataset.desc : '';
        }

        function initApp() {
            document.getElementById('modeSelect').addEventListener('change', function(e) {
                const before = settledSnap;
                applyModeUI(e.target.value);
                generateAll();
                if (before && before.questions.length) setSaveStatus('已切換題型並出新題。', () => restoreCaptured(before));
            });

            // 位數與「尾數含 0」也會改變題目，變更時同步重新出題，避免畫面與設定不一致
            ['d1Select', 'd2Select', 'zeroCheck'].forEach(id => {
                document.getElementById(id).addEventListener('change', () => {
                    const before = settledSnap;
                    generateAll();
                    if (before && before.questions.length) setSaveStatus('已依新設定出新題。', () => restoreCaptured(before));
                });
            });

            document.getElementById('teacherCheck').addEventListener('change', e => setTeacherMode(e.target.checked));
            applyTeacherUI();
            applyModeUI(document.getElementById('modeSelect').value);
            renderHistory();
            generateAll();
        }

        function generateNum(digits) {
            if (digits <= 0) return 0;
            const min = Math.pow(10, digits - 1);
            const max = Math.pow(10, digits) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getTrailingZeroNum(digits) {
            if (digits === 1) return generateNum(1);
            const maxZeros = digits - 1;
            const zeroCount = Math.floor(Math.random() * Math.min(2, maxZeros)) + 1; 
            const baseDigits = digits - zeroCount;
            return generateNum(baseDigits) * Math.pow(10, zeroCount);
        }

        // 直式乘除的兩個數；除法保證被除數不小於除數 (避免商為 0 的退化題)
        function makeOperands(type, d1, d2, isZeroMode) {
            const pick = (d) => isZeroMode ? getTrailingZeroNum(d) : generateNum(d);
            let n1 = pick(d1), n2 = pick(d2);
            if (type === 'div') {
                for (let tries = 0; n1 < n2 && tries < 20; tries++) { n1 = pick(d1); n2 = pick(d2); }
                if (n1 < n2) [n1, n2] = [n2, n1];
            }
            return { n1, n2 };
        }

        // ================= 因數／倍數／公因數／公倍數 出題邏輯 =================
        function gcdCalc(a, b) {
            while (b) { const t = a % b; a = b; b = t; }
            return a;
        }
        function lcmCalc(a, b) {
            return (a * b) / gcdCalc(a, b);
        }

        const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const divisorsOf = (n) => { const d = []; for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; };
        // 混合出題用：60 以內、至少有 4 個因數的數 (避開質數與太簡單的數)
        const MIX_FACTOR_POOL = Array.from({ length: 55 }, (_, i) => i + 6).filter(n => divisorsOf(n).length >= 4);

        // 限定範圍：在 lo 至 hi 之間 (含兩端) 的 n 的因數，答案 1~3 個
        function generateFactorRange() {
            while (true) {
                const n = MIX_FACTOR_POOL[Math.floor(Math.random() * MIX_FACTOR_POOL.length)];
                const lo = randInt(2, Math.max(2, n - 4));
                const hi = Math.min(n, lo + randInt(3, 10));
                const hits = divisorsOf(n).filter(d => d >= lo && d <= hi).length;
                if (hits >= 1 && hits <= 3) return { subType: 'factors_range', n, lo, hi };
            }
        }

        // 限定範圍：在 lo 到 hi 之間 (含兩端) 的 n 的倍數，n 在 19 以內，答案 1~4 個
        function generateMultipleRange() {
            while (true) {
                const n = randInt(2, 19);
                const lo = randInt(2, 18) * 5;
                const hi = lo + randInt(1, 6) * 5;
                const hits = Math.floor(hi / n) - Math.floor((lo - 1) / n);
                if (lo > n && hits >= 1 && hits <= 4) return { subType: 'multiples_range', n, lo, hi };
            }
        }

        function generateFactorQuestion(kind) {
            if (kind === 'mix') {
                if (Math.random() < 0.5) {
                    return { type: 'factor', subType: 'factors', n: MIX_FACTOR_POOL[Math.floor(Math.random() * MIX_FACTOR_POOL.length)] };
                }
                return { type: 'factor', subType: 'multiples', n: randInt(2, 19), count: 6 };
            }
            if (kind === 'range') {
                return { type: 'factor', ...(Math.random() < 0.5 ? generateFactorRange() : generateMultipleRange()) };
            }
            const qData = { type: 'factor', subType: kind };

            const factorPool = [12, 16, 18, 20, 24, 28, 30, 32, 36, 40, 42, 45, 48];
            const smallPool = [2, 3, 4, 5, 6, 7, 8, 9, 10, 12];
            const pairPool = [[12, 18], [8, 12], [16, 24], [9, 15], [10, 15], [6, 9], [14, 21], [20, 30], [15, 20], [12, 16]];
            const multiplePairPool = [[4, 6], [3, 4], [6, 8], [4, 5], [6, 9], [3, 5], [8, 12], [5, 6], [9, 12], [4, 10]];

            if (kind === 'factors') {
                qData.n = factorPool[Math.floor(Math.random() * factorPool.length)];
            } else if (kind === 'multiples') {
                qData.n = smallPool[Math.floor(Math.random() * smallPool.length)];
                qData.count = 6;
            } else if (kind === 'common_factors') {
                const pair = pairPool[Math.floor(Math.random() * pairPool.length)];
                qData.a = pair[0]; qData.b = pair[1];
            } else {
                const pair = multiplePairPool[Math.floor(Math.random() * multiplePairPool.length)];
                qData.a = pair[0]; qData.b = pair[1];
                qData.count = 3;
            }
            return qData;
        }

        // ================= 分數加減 (異分母通分) 出題邏輯 =================
        function generateFractionQuestion() {
            const qData = { type: 'fraction' };
            qData.op = Math.random() > 0.5 ? '+' : '-';

            const denomPairs = [[2, 3], [2, 5], [3, 4], [2, 7], [3, 5], [4, 5], [2, 9], [3, 7], [5, 6], [3, 8], [4, 7], [5, 8]];
            const pair = denomPairs[Math.floor(Math.random() * denomPairs.length)];
            let d1 = pair[0], d2 = pair[1];
            if (Math.random() > 0.5) { [d1, d2] = [d2, d1]; }

            let n1 = Math.floor(Math.random() * (d1 - 1)) + 1;
            let n2 = Math.floor(Math.random() * (d2 - 1)) + 1;

            if (qData.op === '-' && (n1 / d1) < (n2 / d2)) {
                [n1, d1, n2, d2] = [n2, d2, n1, d1];
            }

            qData.n1 = n1; qData.d1 = d1; qData.n2 = n2; qData.d2 = d2;
            return qData;
        }

        const FACTOR_KIND_MAP = { factors: 'factors', multiples: 'multiples', commonFactor: 'common_factors', commonMultiple: 'common_multiples', factorMix: 'mix', factorRange: 'range' };

        // ================= 出題核心邏輯 =================
        function buildQuestion(i, mode, d1, d2, isZeroMode) {
                let qData = {
                    id: Math.random().toString(36).substring(2, 9),
                    label: `第 ${String(i + 1).padStart(2, '0')} 題`,
                    show: false
                };

                if (mode === 'simplify') {
                    qData.type = 'simplify';
                    // 隨機決定型態：加法、乘法、或是新增的【減法湊整】
                    const types = ['add', 'mul', 'sub_two', 'sub_near'];
                    qData.subType = types[Math.floor(Math.random() * types.length)];
                    
                    if (qData.subType === 'add') {
                        const target = (Math.floor(Math.random() * 5) + 5) * 10; 
                        const n1 = Math.floor(Math.random() * (target - 25)) + 11;
                        const n2 = target - n1;
                        const n3 = Math.floor(Math.random() * 80) + 15;
                        qData.nums = [n1, n2, n3].sort(() => Math.random() - 0.5);
                    } else if (qData.subType === 'mul') {
                        const pairs = [[25, 4], [125, 8], [5, 20], [50, 2]];
                        const chosenPair = pairs[Math.floor(Math.random() * pairs.length)];
                        const n3 = Math.floor(Math.random() * 40) + 11;
                        qData.nums = [chosenPair[0], chosenPair[1], n3].sort(() => Math.random() - 0.5);
                    } else if (qData.subType === 'sub_two') {
                        // 連減法湊整：A - B - C -> A - (B + C)
                        const bcTarget = (Math.floor(Math.random() * 4) + 4) * 10; // B+C 湊成 40~70
                        const b = Math.floor(Math.random() * (bcTarget - 15)) + 11;
                        const c = bcTarget - b;
                        const a = bcTarget + Math.floor(Math.random() * 100) + 35; // 確保 A 大於 B+C
                        qData.nums = [a, b, c]; // 固定順序：A - B - C
                    } else if (qData.subType === 'sub_near') {
                        // 接近整百的減法：A - 99 或 A - 98
                        const subNum = Math.random() > 0.5 ? 99 : 98;
                        const a = Math.floor(Math.random() * 150) + 120;
                        qData.nums = [a, subNum];
                    }
                } else if (mode === 'time') {
                    qData.type = 'time';
                    // 包含單一換算與【複名數換算、未滿一日/時/分】的多元題型
                    const directions = ['compound_to_small', 'small_to_compound', 'under_one_unit'];
                    qData.subType = directions[Math.floor(Math.random() * directions.length)];
                    
                    if (qData.subType === 'compound_to_small') {
                        // 複名數換成單一小單位，例如：2時15分 = ()分
                        qData.unitPair = Math.random() > 0.5 ? {big: '小時', small: '分鐘', rate: 60} : {big: '分鐘', small: '秒', rate: 60};
                        if (Math.random() > 0.6) qData.unitPair = {big: '日', small: '小時', rate: 24};
                        qData.vBig = Math.floor(Math.random() * 5) + 1;
                        qData.vSmall = Math.floor(Math.random() * (qData.unitPair.rate - 5)) + 2;
                    } else if (qData.subType === 'small_to_compound') {
                        // 大量小單位換成複名數，例如：135秒 = ()分()秒
                        qData.unitPair = Math.random() > 0.5 ? {big: '小時', small: '分鐘', rate: 60} : {big: '分鐘', small: '秒', rate: 60};
                        if (Math.random() > 0.6) qData.unitPair = {big: '日', small: '小時', rate: 24};
                        qData.totalSmall = Math.floor(Math.random() * (qData.unitPair.rate * 3)) + (qData.unitPair.rate + 5);
                    } else {
                        // 【未滿一日、一時、一分】的特殊除法思維題
                        qData.unitPair = Math.random() > 0.5 ? {big: '日', small: '小時', rate: 24} : {big: '小時', small: '分鐘', rate: 60};
                        if (Math.random() > 0.5 && qData.unitPair.big === '日') qData.unitPair = {big: '分鐘', small: '秒', rate: 60};
                        qData.totalSmall = Math.floor(Math.random() * (qData.unitPair.rate - 5)) + 3; // 刻意讓總數小於進位率
                    }
                } else if (FACTOR_KIND_MAP[mode]) {
                    Object.assign(qData, generateFactorQuestion(FACTOR_KIND_MAP[mode]));
                } else if (mode === 'fraction') {
                    Object.assign(qData, generateFractionQuestion());
                } else {
                    qData.type = mode === 'mix' ? (i < 4 ? 'mul' : 'div') : mode;
                    Object.assign(qData, makeOperands(qData.type, d1, d2, isZeroMode));
                }

            return qData;
        }

        function currentSettings() {
            return {
                mode: document.getElementById('modeSelect').value,
                d1: parseInt(document.getElementById('d1Select').value),
                d2: parseInt(document.getElementById('d2Select').value),
                isZeroMode: document.getElementById('zeroCheck').checked
            };
        }

        function generateAll() {
            const { mode, d1, d2, isZeroMode } = currentSettings();
            questions = Array.from({ length: 8 }, (_, i) => buildQuestion(i, mode, d1, d2, isZeroMode));
            renderAll();
        }

        function refreshOne(event, index) {
            event.stopPropagation();
            const { mode, d1, d2, isZeroMode } = currentSettings();
            const qData = buildQuestion(index, mode, d1, d2, isZeroMode);

            questions[index] = qData;
            renderAll();
            const btn = document.getElementById(`refresh-${index}`);
            if (btn) btn.focus();
        }

        // ================= 歷史快照儲存 =================
        function saveCurrentToHistory() {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const record = {
                id: Date.now(), time: timeStr,
                mode: document.getElementById('modeSelect').value,
                d1: document.getElementById('d1Select').value,
                d2: document.getElementById('d2Select').value,
                zero: document.getElementById('zeroCheck').checked,
                data: JSON.parse(JSON.stringify(questions))
            };
            historyRecords.unshift(record);
            const dropped = historyRecords.length > 8;
            if (dropped) historyRecords.pop();
            const saved = storageSet('math_snapshots', JSON.stringify(historyRecords));
            renderHistory();
            setSaveStatus(!saved
                ? '無法寫入瀏覽器儲存空間，這組題目只保留到關閉頁面為止。'
                : dropped ? '已儲存。最多保留 8 組，最舊的一組已移除。' : '已儲存這組題目。');
        }

        let statusTimer = null;
        // 狀態訊息；附 undoFn 時顯示「復原」按鈕，數秒後自動消失
        function setSaveStatus(text, undoFn) {
            const status = document.getElementById('saveStatus');
            if (!status) return;
            clearTimeout(statusTimer);
            status.textContent = text;
            if (undoFn) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = '復原';
                btn.className = 'ml-2 px-3 min-h-[40px] rounded-md border border-stone-400 bg-white text-stone-900 hover:bg-stone-100 transition';
                btn.onclick = () => { undoFn(); status.textContent = '已復原。'; statusTimer = setTimeout(() => { status.textContent = ''; }, 4000); };
                status.appendChild(btn);
            }
            statusTimer = setTimeout(() => { status.textContent = ''; }, undoFn ? 10000 : 6000);
        }

        // 目前題組與設定的快照，用來讓「重新出題／切換題型／讀取存檔」可以復原
        let settledSnap = null;
        function captureCurrent() {
            return {
                questions: JSON.parse(JSON.stringify(questions)),
                mode: document.getElementById('modeSelect').value,
                d1: document.getElementById('d1Select').value,
                d2: document.getElementById('d2Select').value,
                zero: document.getElementById('zeroCheck').checked
            };
        }
        function restoreCaptured(s) {
            if (!s) return;
            document.getElementById('modeSelect').value = s.mode;
            document.getElementById('d1Select').value = s.d1;
            document.getElementById('d2Select').value = s.d2;
            document.getElementById('zeroCheck').checked = s.zero;
            applyModeUI(s.mode);
            questions = s.questions;
            renderAll();
        }
        function regenerateWithUndo() {
            const before = settledSnap;
            generateAll();
            if (before && before.questions.length) setSaveStatus('已出新題。', () => restoreCaptured(before));
        }

        function modeShortName(mode) {
            const opt = document.querySelector(`#modeSelect option[value="${mode}"]`);
            return opt ? opt.dataset.short : '';
        }

        function loadHistory(id) {
            const record = historyRecords.find(r => r.id === id);
            if (!record) return;
            const before = settledSnap;
            // 連同當時的題型與位數一起還原，設定列才會和題目一致
            if (record.mode && modeShortName(record.mode)) {
                document.getElementById('modeSelect').value = record.mode;
                if (record.d1) document.getElementById('d1Select').value = record.d1;
                if (record.d2) document.getElementById('d2Select').value = record.d2;
                document.getElementById('zeroCheck').checked = !!record.zero;
                applyModeUI(record.mode);
            }
            questions = JSON.parse(JSON.stringify(record.data)).map(q => ({...q, show: false}));
            renderAll();
            setSaveStatus(`已讀取 ${record.time} 的題組。`, before && before.questions.length ? () => restoreCaptured(before) : null);
        }

        function deleteHistory(id) {
            const index = historyRecords.findIndex(r => r.id === id);
            if (index < 0) return;
            const [record] = historyRecords.splice(index, 1);
            const saved = storageSet('math_snapshots', JSON.stringify(historyRecords));
            renderHistory();
            setSaveStatus(saved ? '已刪除這組存檔。' : '已從畫面移除，但無法更新瀏覽器儲存空間。', () => {
                historyRecords.splice(index, 0, record);
                storageSet('math_snapshots', JSON.stringify(historyRecords));
                renderHistory();
            });
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (historyRecords.length === 0) {
                container.innerHTML = '<span class="text-stone-600 text-sm whitespace-nowrap">尚無存檔</span>';
                return;
            }
            container.innerHTML = historyRecords.map((r) => {
                const label = `${r.time}・${modeDigitsLabel(r.mode, r.d1, r.d2)}`;
                return `
                <span class="inline-flex items-stretch bg-white border border-stone-300 rounded-full overflow-hidden text-sm font-bold text-stone-700">
                    <button type="button" onclick="loadHistory(${r.id})" class="pl-4 pr-2 min-h-[40px] hover:bg-stone-800 hover:text-white transition" aria-label="讀取 ${label}">${label}</button>
                    <button type="button" onclick="deleteHistory(${r.id})" class="px-3.5 min-h-[40px] text-stone-600 hover:bg-red-700 hover:text-white transition" aria-label="刪除 ${label}" title="刪除這組存檔">×</button>
                </span>`;
            }).join('');
        }

        function toggleShow(index) {
            if (!teacherMode) return;
            questions[index].show = !questions[index].show;
            renderAll();
            const btn = document.getElementById(`reveal-${index}`);
            if (btn) btn.focus();
        }

        function countTrailingZeros(num) {
            const str = num.toString();
            const match = str.match(/0+$/);
            return match ? match[0].length : 0;
        }

        // ================= 各題型 HTML 渲染引擎 =================

        // 未展開：只有題目。展開：答案出現在題目右側，詳解在題目下方
        function splitReveal(show, left, answer, detail) {
            if (!show) return `<div class="w-full">${left}</div>`;
            return `<div class="w-full"><div class="answer-row"><div class="answer-q">${left}</div><div class="answer-a">＝ ${answer}</div></div>${detail}</div>`;
        }

        // 1. 簡化計算引擎 (擴充減法功能)
        function buildSimplifyHTML(q, show) {
            const nums = q.nums;
            let titleText = "";
            let stepHtml = "";
            let finalAns = 0;

            if (q.subType === 'add') {
                titleText = `<div class="q-title mb-2">${nums[0]} ＋ ${nums[1]} ＋ ${nums[2]} ＝ ？</div>`;
                let p1 = 0, p2 = 1, p3 = 2;
                if ((nums[0] + nums[1]) % 10 === 0) { p1 = 0; p2 = 1; p3 = 2; }
                else if ((nums[0] + nums[2]) % 10 === 0) { p1 = 0; p2 = 2; p3 = 1; }
                else { p1 = 1; p2 = 2; p3 = 0; }
                finalAns = nums[0] + nums[1] + nums[2];
                stepHtml = `
                    <span class="text-stone-900 font-bold">湊整想法（交換律）：</span><br>
                    先將尾數能湊成十的組合圈起來：<br>
                    <span class="underline">${nums[p1]} ＋ ${nums[p2]} ＝ ${nums[p1] + nums[p2]}</span><br>
                    再加入第三個數：<br>
                    ${nums[p1] + nums[p2]} ＋ ${nums[p3]} ＝ <span class="text-orange-700 font-bold">${finalAns}</span>`;
            } else if (q.subType === 'mul') {
                titleText = `<div class="q-title mb-2">${nums[0]} × ${nums[1]} × ${nums[2]} ＝ ？</div>`;
                let p1 = 0, p2 = 1, p3 = 2;
                const checkPair = (a, b) => (a*b===100 || a*b===1000 || a*b===10 || a*b===40);
                if (checkPair(nums[0], nums[1])) { p1 = 0; p2 = 1; p3 = 2; }
                else if (checkPair(nums[0], nums[2])) { p1 = 0; p2 = 2; p3 = 1; }
                else { p1 = 1; p2 = 2; p3 = 0; }
                finalAns = nums[0] * nums[1] * nums[2];
                stepHtml = `
                    <span class="text-stone-900 font-bold">湊整想法（結合律）：</span><br>
                    先找乘法好朋友組合：<br>
                    <span class="underline">${nums[p1]} × ${nums[p2]} ＝ ${nums[p1] * nums[p2]}</span><br>
                    接著計算：<br>
                    ${nums[p1] * nums[p2]} × ${nums[p3]} ＝ <span class="text-orange-700 font-bold">${finalAns}</span>`;
            } else if (q.subType === 'sub_two') {
                // 連減法：A - B - C = A - (B + C)
                titleText = `<div class="q-title mb-2">${nums[0]} － ${nums[1]} － ${nums[2]} ＝ ？</div>`;
                finalAns = nums[0] - nums[1] - nums[2];
                stepHtml = `
                    <span class="text-stone-900 font-bold">連減想法（去括號法則）：</span><br>
                    連續減去兩個數，等於【減去這兩數的和】：<br>
                    式子變成：${nums[0]} － <span class="underline">(${nums[1]} ＋ ${nums[2]})</span><br>
                    ＝ ${nums[0]} － ${nums[1] + nums[2]}<br>
                    ＝ <span class="text-orange-700 font-bold">${finalAns}</span>`;
            } else if (q.subType === 'sub_near') {
                // 接近整百：A - 99 = A - 100 + 1
                titleText = `<div class="q-title mb-2">${nums[0]} － ${nums[1]} ＝ ？</div>`;
                finalAns = nums[0] - nums[1];
                let adjust = nums[1] === 99 ? 1 : 2;
                stepHtml = `
                    <span class="text-stone-900 font-bold">接近整百速算：</span><br>
                    把 －${nums[1]} 當作先減去 100，再【加回 ${adjust}】！<br>
                    式子變成：${nums[0]} － 100 ＋ ${adjust}<br>
                    ＝ ${nums[0] - 100} ＋ ${adjust}<br>
                    ＝ <span class="text-orange-700 font-bold">${finalAns}</span>`;
            }

            return `
                ${splitReveal(show, titleText, finalAns, `
                    <div class="detail-show w-full mt-2">
                        <div class="text-sm text-left bg-[#f6efdc] text-stone-900 border border-stone-300 p-3 rounded-lg leading-relaxed font-sans">
                            ${stepHtml}
                        </div>
                    </div>`)}`;
        }

        // 2. 時間換算引擎 (全面擴充複名數、未滿一日/時/分題型)
        function buildTimeHTML(q, show) {
            let titleText = "";
            let stepHtml = "";
            let finalAnsText = "";

            if (q.subType === 'compound_to_small') {
                titleText = `<div class="q-title mb-2">${q.vBig} ${q.unitPair.big} ${q.vSmall} ${q.unitPair.small} ＝ (   ) ${q.unitPair.small}</div>`;
                const calculated = q.vBig * q.unitPair.rate;
                finalAnsText = `${calculated + q.vSmall} ${q.unitPair.small}`;
                stepHtml = `
                    <span class="text-stone-900 font-bold">複名數拆解（大變小）：</span><br>
                    先將大單位換算出來：<br>
                    ${q.vBig} ${q.unitPair.big} ＝ ${q.unitPair.rate} × ${q.vBig} ＝ ${calculated} ${q.unitPair.small}<br>
                    最後加上原本的：<br>
                    ${calculated} ＋ ${q.vSmall} ＝ <span class="text-orange-700 font-bold">${calculated + q.vSmall}</span> ${q.unitPair.small}`;
            } else if (q.subType === 'small_to_compound') {
                titleText = `<div class="q-title mb-2">${q.totalSmall} ${q.unitPair.small} ＝ (   ) ${q.unitPair.big} (   ) ${q.unitPair.small}</div>`;
                const bigVal = Math.floor(q.totalSmall / q.unitPair.rate);
                const smallVal = q.totalSmall % q.unitPair.rate;
                finalAnsText = `${bigVal} ${q.unitPair.big} ${smallVal} ${q.unitPair.small}`;
                stepHtml = `
                    <span class="text-stone-900 font-bold">複名數歸納（小變大）：</span><br>
                    每 ${q.unitPair.rate} ${q.unitPair.small} 可以進位成 1 ${q.unitPair.big}。<br>
                    算式：${q.totalSmall} ÷ ${q.unitPair.rate} ＝ ${bigVal} ... ${smallVal}<br>
                    商數就是【${q.unitPair.big}】，餘數就是剩下來的【${q.unitPair.small}】。`;
            } else if (q.subType === 'under_one_unit') {
                // 特殊：未滿一日/時/分
                titleText = `<div class="q-title mb-2">${q.totalSmall} ${q.unitPair.small} ＝ (   ) ${q.unitPair.big} (   ) ${q.unitPair.small}</div>`;
                finalAnsText = `0 ${q.unitPair.big} ${q.totalSmall} ${q.unitPair.small}`;
                stepHtml = `
                    <span class="text-stone-900 font-bold">教學核心：未滿一單位</span><br>
                    因為總數 <span class="text-stone-900 font-bold">${q.totalSmall}</span> 小於進位標準 ${q.unitPair.rate}，不夠換成 1 ${q.unitPair.big}！<br>
                    算式：${q.totalSmall} ÷ ${q.unitPair.rate} ＝ <span class="text-orange-700 font-bold">0</span> ... <span class="text-orange-700 font-bold">${q.totalSmall}</span><br>
                    因此換算結果為：<span class="font-bold">0 ${q.unitPair.big}</span> 剩餘 <span class="font-bold">${q.totalSmall} ${q.unitPair.small}</span>。`;
            }

            return `
                ${splitReveal(show, titleText, finalAnsText, `
                    <div class="detail-show w-full mt-2">
                        <div class="text-sm text-left bg-[#f6efdc] text-stone-900 border border-stone-300 p-3 rounded-lg leading-relaxed font-sans">
                            ${stepHtml}
                        </div>
                    </div>`)}`;
        }

        // 題目區橫式提示 (鷹架)：只列算式、答案留空，勾選才顯示
        function buildFactorScaffold(q) {
            const box = document.getElementById('hintCheck');
            if (!box || !box.checked) return "";
            const blank = '<span class="inline-block w-10 border-b border-gray-400 align-bottom">&nbsp;</span>';
            const list = (label, n, op, upTo, cols) => {
                let rows = "";
                for (let i = 1; i <= upTo; i++) rows += `<div>${n}${op}${i}＝${blank}</div>`;
                return `<div><div class="font-bold text-gray-500 mb-1">${label}</div><div class="grid ${cols} gap-x-3 gap-y-1 font-mono">${rows}</div></div>`;
            };
            let inner = "";
            if (q.subType === 'factors') {
                inner = list(`提示：哪些數可以整除 ${q.n}？（先試前幾個，寫出商與餘數）`, q.n, '÷', 5, 'grid-cols-2');
            } else if (q.subType === 'multiples') {
                inner = list(`提示：${q.n} × 幾？（先寫前幾個）`, q.n, '×', 5, 'grid-cols-2');
            } else if (q.subType === 'factors_range') {
                let rows = "";
                for (let i = q.lo; i <= q.hi; i++) rows += `<div>${q.n}÷${i}＝${blank}</div>`;
                inner = `<div class="font-bold text-gray-500 mb-1">提示：${q.lo} 到 ${q.hi} 之間，哪些數可以整除 ${q.n}？</div><div class="grid grid-cols-2 gap-x-3 gap-y-1 font-mono">${rows}</div>`;
            } else if (q.subType === 'multiples_range') {
                inner = `<div class="font-bold text-gray-500 mb-1">提示：先估計從 ${q.n} × 幾開始超過 ${q.lo}</div><div class="grid grid-cols-1 gap-y-1 font-mono"><div>${q.lo}÷${q.n}＝${blank}...${blank}</div><div>${q.n}×${blank}＝${blank}</div><div>${q.n}×${blank}＝${blank}</div><div>${q.n}×${blank}＝${blank}</div></div>`;
            } else if (q.subType === 'common_factors') {
                inner = `<div class="font-bold text-gray-500 mb-1">提示：哪些數可以同時整除 ${q.a} 和 ${q.b}？</div><div class="grid grid-cols-2 gap-3">${list(`${q.a} ÷ 幾`, q.a, '÷', 5, 'grid-cols-1')}${list(`${q.b} ÷ 幾`, q.b, '÷', 5, 'grid-cols-1')}</div>`;
            } else {
                inner = `<div class="grid grid-cols-2 gap-3">${list(`${q.a} × 幾`, q.a, '×', 5, 'grid-cols-1')}${list(`${q.b} × 幾`, q.b, '×', 5, 'grid-cols-1')}</div>`;
            }
            return `<div class="w-full text-sm bg-white border border-dashed border-orange-300 rounded-lg p-2 mt-1">${inner}</div>`;
        }

        // 3. 因數／倍數／公因數／公倍數引擎 (含乘除法算式輔助)
        function buildFactorHTML(q, show) {
            let titleText = "";
            let aidHtml = "";
            let answerHtml = "";

            if (q.subType === 'factors') {
                const n = q.n;
                titleText = `<div class="q-title mb-2">${n} 的因數有哪些？</div>`;
                const factors = [];
                let rows = "";
                for (let i = 1; i <= n; i++) {
                    if (n % i === 0) {
                        factors.push(i);
                        rows += `<div class="text-orange-800 font-bold">${n}÷${i}＝${n / i} ✓</div>`;
                    } else {
                        rows += `<div class="text-stone-600">${n}÷${i}＝${Math.floor(n / i)}...${n % i}</div>`;
                    }
                }
                aidHtml = `
                    <span class="text-stone-900 font-bold">輔助算式（逐一測試除法，整除的就是因數）：</span>
                    <div class="grid grid-cols-2 gap-x-2 gap-y-0.5 mt-2 font-mono">${rows}</div>`;
                answerHtml = `${factors.join('、')}（共 ${factors.length} 個）`;
            } else if (q.subType === 'multiples') {
                const n = q.n, count = q.count;
                titleText = `<div class="q-title mb-2">${n} 的倍數有哪些？(請寫出前 ${count} 個)</div>`;
                const mults = [];
                let rows = "";
                for (let i = 1; i <= count; i++) {
                    mults.push(n * i);
                    rows += `<div class="text-orange-800 font-bold">${n}×${i}＝${n * i}</div>`;
                }
                aidHtml = `
                    <span class="text-stone-900 font-bold">輔助算式（用乘法依序找倍數）：</span>
                    <div class="grid grid-cols-2 gap-x-2 gap-y-0.5 mt-2 font-mono">${rows}</div>`;
                answerHtml = `${mults.join('、')}`;
            } else if (q.subType === 'factors_range') {
                const { n, lo, hi } = q;
                titleText = `<div class="q-title mb-2">在 ${lo} 至 ${hi} 之間（含 ${lo} 和 ${hi}）的 ${n} 的因數有哪些？</div>`;
                const factors = divisorsOf(n);
                const picked = factors.filter(d => d >= lo && d <= hi);
                const chips = factors.map(d => picked.includes(d)
                    ? `<span class="text-orange-800 font-bold underline">${d}</span>`
                    : `<span class="text-stone-600">${d}</span>`).join('、');
                let rows = "";
                for (let i = lo; i <= hi; i++) {
                    rows += n % i === 0
                        ? `<div class="text-orange-800 font-bold">${n}÷${i}＝${n / i} ✓</div>`
                        : `<div class="text-stone-600">${n}÷${i}＝${Math.floor(n / i)}...${n % i}</div>`;
                }
                aidHtml = `
                    <span class="text-stone-900 font-bold">輔助算式（只測試 ${lo}～${hi}，含 ${lo} 和 ${hi}）：</span>
                    <div class="grid grid-cols-2 gap-x-2 gap-y-0.5 mt-2 font-mono">${rows}</div>
                    <div class="mt-2">${n} 的所有因數：${chips}<br>落在 ${lo}～${hi} 之間的才是答案。</div>`;
                answerHtml = `${picked.join('、')}`;
            } else if (q.subType === 'multiples_range') {
                const { n, lo, hi } = q;
                titleText = `<div class="q-title mb-2">在 ${lo} 到 ${hi} 之間（含 ${lo} 和 ${hi}）的 ${n} 的倍數有哪些？</div>`;
                const startK = Math.max(1, Math.floor(lo / n));
                const picked = [];
                let rows = "";
                for (let k = startK; n * k <= hi + n; k++) {
                    const v = n * k;
                    const inRange = v >= lo && v <= hi;
                    if (inRange) picked.push(v);
                    rows += `<div class="${inRange ? 'text-orange-800 font-bold' : 'text-stone-600'}">${n}×${k}＝${v}${inRange ? ' ✓' : ''}</div>`;
                }
                aidHtml = `
                    <span class="text-stone-900 font-bold">輔助算式（先估計起點，含 ${lo} 和 ${hi}）：</span><br>
                    ${lo} ÷ ${n} ＝ ${Math.floor(lo / n)} ... ${lo % n}，所以從 ${n} × ${startK} 附近開始找：
                    <div class="grid grid-cols-2 gap-x-2 gap-y-0.5 mt-2 font-mono">${rows}</div>`;
                answerHtml = `${picked.join('、')}`;
            } else if (q.subType === 'common_factors') {
                const a = q.a, b = q.b;
                titleText = `<div class="q-title mb-2">${a} 和 ${b} 的公因數有哪些？</div>`;
                const factorsA = [], factorsB = [];
                let rowsA = "", rowsB = "";
                for (let i = 1; i <= a; i++) {
                    if (a % i === 0) { factorsA.push(i); rowsA += `<div class="text-orange-800 font-bold">${a}÷${i}＝${a / i} ✓</div>`; }
                    else { rowsA += `<div class="text-stone-600">${a}÷${i}＝${Math.floor(a / i)}...${a % i}</div>`; }
                }
                for (let i = 1; i <= b; i++) {
                    if (b % i === 0) { factorsB.push(i); rowsB += `<div class="text-orange-800 font-bold">${b}÷${i}＝${b / i} ✓</div>`; }
                    else { rowsB += `<div class="text-stone-600">${b}÷${i}＝${Math.floor(b / i)}...${b % i}</div>`; }
                }
                const common = factorsA.filter(x => factorsB.includes(x));
                const g = gcdCalc(a, b);
                aidHtml = `
                    <span class="text-stone-900 font-bold">輔助算式（分別列出兩數的除法算式）：</span>
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <div><div class="font-bold text-gray-600 mb-1">${a} 的因數：</div><div class="font-mono">${rowsA}</div></div>
                        <div><div class="font-bold text-gray-600 mb-1">${b} 的因數：</div><div class="font-mono">${rowsB}</div></div>
                    </div>
                    <div class="mt-2">兩邊都整除的數字就是【公因數】，其中最大的稱為<span class="font-bold">最大公因數</span>。</div>`;
                answerHtml = `${common.join('、')}（最大公因數為 ${g}）`;
            } else {
                const a = q.a, b = q.b, count = q.count;
                const l = lcmCalc(a, b);
                titleText = `<div class="q-title mb-2">${a} 和 ${b} 的公倍數有哪些？(請寫出前 ${count} 個)</div>`;
                const limit = l * count;
                let rowsA = "", rowsB = "";
                for (let i = 1; a * i <= limit; i++) {
                    const isCommon = (a * i) % l === 0;
                    rowsA += `<div class="${isCommon ? 'text-orange-800 font-bold' : 'text-stone-600'}">${a}×${i}＝${a * i}${isCommon ? ' ✓' : ''}</div>`;
                }
                for (let i = 1; b * i <= limit; i++) {
                    const isCommon = (b * i) % l === 0;
                    rowsB += `<div class="${isCommon ? 'text-orange-800 font-bold' : 'text-stone-600'}">${b}×${i}＝${b * i}${isCommon ? ' ✓' : ''}</div>`;
                }
                const commons = [];
                for (let i = 1; i <= count; i++) commons.push(l * i);
                aidHtml = `
                    <span class="text-stone-900 font-bold">輔助算式（分別列出兩數的乘法算式）：</span>
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <div><div class="font-bold text-gray-600 mb-1">${a} 的倍數：</div><div class="font-mono">${rowsA}</div></div>
                        <div><div class="font-bold text-gray-600 mb-1">${b} 的倍數：</div><div class="font-mono">${rowsB}</div></div>
                    </div>
                    <div class="mt-2">兩邊都出現的數字就是【公倍數】，其中最小的稱為<span class="font-bold">最小公倍數</span>。</div>`;
                answerHtml = `${commons.join('、')}（最小公倍數為 ${l}）`;
            }

            return `
                ${splitReveal(show, `${titleText}${buildFactorScaffold(q)}`, answerHtml, `
                    <div class="detail-show w-full mt-2">
                        <div class="text-sm text-left bg-[#f6efdc] text-stone-900 border border-stone-300 p-3 rounded-lg leading-relaxed font-sans">
                            ${aidHtml}
                        </div>
                    </div>`)}`;
        }

        // 4. 分數加減 (異分母通分) 引擎
        function fracHTML(num, den) {
            return `<div class="flex flex-col items-center leading-none">
                <span class="px-1">${num}</span>
                <span class="w-full border-t-2 border-current my-0.5"></span>
                <span class="px-1">${den}</span>
            </div>`;
        }

        function buildFractionHTML(q, show) {
            const { n1, d1, n2, d2, op } = q;
            const l = lcmCalc(d1, d2);
            const c1 = n1 * (l / d1);
            const c2 = n2 * (l / d2);
            const resultNum = op === '+' ? c1 + c2 : c1 - c2;
            const g = gcdCalc(Math.abs(resultNum), l);
            const simpNum = resultNum / g;
            const simpDen = l / g;

            const titleText = `
                <div role="img" aria-label="${d1}分之${n1} ${op === '+' ? '加' : '減'} ${d2}分之${n2} 等於多少" class="q-title q-title-lg flex items-center gap-3 mb-2">
                    ${fracHTML(n1, d1)}
                    <span>${op === '+' ? '＋' : '－'}</span>
                    ${fracHTML(n2, d2)}
                    <span>＝</span>
                    <span>?</span>
                </div>`;

            const aidHtml = `
                <span class="text-stone-900 font-bold">異分母加減：先通分（找分母的最小公倍數）</span><br>
                ${d1} 和 ${d2} 的最小公倍數 ＝ ${l}<br>
                通分：${n1}/${d1} ＝ ${c1}/${l}　，　${n2}/${d2} ＝ ${c2}/${l}<br>
                計算：${c1} ${op} ${c2} ＝ ${resultNum}<br>
                所以 ${resultNum}/${l}${g > 1 ? `，約分（分子分母同除以 ${g}）＝ <span class="text-orange-700 font-bold">${simpNum}/${simpDen}</span>` : ''}`;

            const answerText = simpDen === 1 ? `${simpNum}` : `${simpNum}/${simpDen}`;

            return `
                ${splitReveal(show, titleText, answerText, `
                    <div class="detail-show w-full mt-2">
                        <div class="text-sm text-left bg-[#f6efdc] text-stone-900 border border-stone-300 p-3 rounded-lg leading-relaxed font-sans">
                            ${aidHtml}
                        </div>
                    </div>`)}`;
        }

        // 5. 常規直式：乘法引擎 (頂部進位)
        function buildMulHTML(n1, n2, show) {
            const n1Str = n1.toString();
            const n2Str = n2.toString();
            const ansStr = (n1 * n2).toString();
            const width = Math.max(n1Str.length, n2Str.length + 2, ansStr.length);
            
            const z1 = countTrailingZeros(n1);
            const z2 = countTrailingZeros(n2);
            let simplifyTip = "";
            if (z1 > 0 || z2 > 0) {
                const sN1 = n1 / Math.pow(10, z1);
                const sN2 = n2 / Math.pow(10, z2);
                simplifyTip = `<div class="mt-3 text-sm bg-[#f6efdc] text-stone-900 p-2 rounded border border-stone-300 font-bold whitespace-normal leading-normal">簡化想法：先算 ${sN1} × ${sN2} ＝ ${sN1 * sN2}，最後尾數再補上 ${z1 + z2} 個 0。</div>`;
            }

            let carryHTML = "";
            let detail = "";
            const s2 = n2Str.split('').reverse();
            let validSteps = 0;
            
            for(let i=0; i<s2.length; i++) {
                if(s2[i] !== '0') {
                    const digitB = parseInt(s2[i]);
                    const product = n1 * digitB;
                    const prodStr = product.toString();
                    
                    let carryArr = new Array(n1Str.length).fill(" ");
                    let currentCarry = 0;
                    for (let k = n1Str.length - 1; k >= 0; k--) {
                        let digitA = parseInt(n1Str[k]);
                        let prod = digitA * digitB + currentCarry;
                        let nextCarry = Math.floor(prod / 10);
                        if (k - 1 >= 0 && nextCarry > 0) {
                            carryArr[k - 1] = nextCarry.toString();
                        }
                        currentCarry = nextCarry;
                    }
                    let carryStr = carryArr.join('');
                    
                    if (carryStr.trim().length > 0) {
                       let padLeft = width - n1Str.length;
                       carryHTML = `<div class="text-red-500 font-bold">` + " ".repeat(Math.max(0, padLeft)) + carryStr + `</div>` + carryHTML;
                    }
                    
                    const padLeft = width - i - prodStr.length;
                    detail += " ".repeat(Math.max(0, padLeft)) + prodStr + " ".repeat(i) + "\n";
                    validSteps++;
                }
            }
            
            let carryContainer = (show && carryHTML !== "") ? `<div class="detail-show">${carryHTML}</div>` : "";
            let baseMath = `<div>` + " ".repeat(width - n1Str.length) + n1Str + "\n" + " ".repeat(width - n2Str.length - 2) + "× " + n2Str + "\n" + "-".repeat(width) + `</div>`;
            
            if (validSteps > 1) {
                detail += "-".repeat(width) + "\n";
                detail += `<span class="text-orange-700 font-bold">` + " ".repeat(width - ansStr.length) + ansStr + `</span>\n`;
            } else {
                detail += `<span class="text-orange-700 font-bold">` + " ".repeat(width - ansStr.length) + ansStr + `</span>\n`;
            }

            return splitReveal(show,
                `<div role="img" aria-label="${n1} 乘以 ${n2}" class="math-font px-2 text-left">${carryContainer}${baseMath}</div>`,
                ansStr,
                `<div class="math-font px-2 text-left"><div class="detail-show text-gray-600">${detail}</div></div>${simplifyTip}`);
        }

        // 6. 常規直式：除法引擎
        function buildDivHTML(n1, n2, show) {
            const q = Math.floor(n1 / n2).toString();
            const r = n1 % n2;
            const n1Str = n1.toString();
            const n2Str = n2.toString();
            const preLen = n2Str.length + 3; 
            
            const z1 = countTrailingZeros(n1);
            const z2 = countTrailingZeros(n2);
            let simplifyTip = "";
            if (z1 > 0 && z2 > 0) {
                const commonZeros = Math.min(z1, z2);
                const sN1 = n1 / Math.pow(10, commonZeros);
                const sN2 = n2 / Math.pow(10, commonZeros);
                const sR = sN1 % sN2;
                let rTip = r > 0 ? `，簡化餘數 ${sR} 要放大 ${Math.pow(10, commonZeros)} 倍變成實質餘數 ${r}` : "（剛好整除）";
                simplifyTip = `<div class="mt-3 text-sm bg-[#f6efdc] text-stone-900 p-2 rounded border border-stone-300 font-bold whitespace-normal leading-normal">簡化想法：被除數與除數同時劃掉 ${commonZeros} 個 0，變成算 ${sN1} ÷ ${sN2}${rTip}。</div>`;
            }

            let outTop = "";
            const qPad = preLen + n1Str.length - q.length;
            outTop += show
                ? `<div class="text-orange-700 font-bold">` + " ".repeat(qPad) + q + "</div>"
                : `<div> </div>`;
            
            let outBase = "";
            outBase += " ".repeat(preLen) + "-".repeat(n1Str.length) + "\n";
            outBase += n2Str + " ) " + n1Str + "\n";
            
            let detail = "";
            let cv = "";
            let stepsCount = 0;
            
            for (let i = 0; i < n1Str.length; i++) {
                cv += n1Str[i];
                let cvNum = parseInt(cv, 10);
                
                if (cvNum >= n2 || (i === n1Str.length - 1 && stepsCount > 0)) {
                    let sub = Math.floor(cvNum / n2) * n2;
                    if (sub > 0 || i === n1Str.length - 1) {
                        let subStr = sub.toString();
                        if (sub > 0) {
                            let subPad = preLen + i + 1 - subStr.length;
                            detail += " ".repeat(subPad) + subStr + "\n";
                            let dashLen = Math.max(cv.length, subStr.length);
                            let dashPad = preLen + i + 1 - dashLen;
                            detail += " ".repeat(dashPad) + "-".repeat(dashLen) + "\n";
                            cv = (cvNum - sub).toString();
                            if (cv === "0") cv = ""; 
                        }
                        
                        if (i < n1Str.length - 1) {
                            let displayCv = cv + n1Str[i+1];
                            let dropPad = preLen + i + 2 - displayCv.length;
                            detail += " ".repeat(dropPad) + displayCv + "\n";
                            stepsCount++;
                        } else {
                            let displayCv = cv === "" ? "0" : cv;
                            let remPad = preLen + i + 1 - displayCv.length;
                            detail += " ".repeat(remPad) + displayCv + "\n";
                        }
                    }
                } else if (i < n1Str.length - 1 && stepsCount > 0) {
                     let displayCv = parseInt(cv + n1Str[i+1], 10).toString(); 
                     let dropPad = preLen + i + 2 - displayCv.length;
                     detail += " ".repeat(dropPad) + displayCv + "\n";
                }
            }

            if (r > 0) {
                detail += `\n<span class="text-orange-800 font-bold text-sm"> (餘數為 ${r})</span>`;
            }

            return splitReveal(show,
                `<div role="img" aria-label="${n1} 除以 ${n2}" class="math-font px-2 text-left"><div> </div>${outBase}</div>`,
                `${q}${r > 0 ? `　餘 ${r}` : ''}`,
                `<div class="math-font px-2 text-left"><div class="detail-show text-gray-600">${detail}</div></div>${simplifyTip}`);
        }

        // ================= 畫面渲染主引擎 =================
        // 依 show 決定是否內嵌解答；畫面、列印題目、列印答案卷共用
        function cardParts(q, show) {
                let mathContent = "";
                let typeLabel = "";

                if (q.type === 'simplify') {
                    mathContent = buildSimplifyHTML(q, show);
                    if (q.subType === 'add') typeLabel = '加法簡化';
                    else if (q.subType === 'mul') typeLabel = '乘法簡化';
                    else if (q.subType === 'sub_two') typeLabel = '減法簡化(連減)';
                    else if (q.subType === 'sub_near') typeLabel = '減法簡化(補數)';
                } else if (q.type === 'time') {
                    mathContent = buildTimeHTML(q, show);
                    if (q.subType === 'compound_to_small') typeLabel = '時間：複名數換算';
                    else if (q.subType === 'small_to_compound') typeLabel = '時間：單位進位';
                    else if (q.subType === 'under_one_unit') typeLabel = '時間：未滿一單位';
                } else if (q.type === 'factor') {
                    mathContent = buildFactorHTML(q, show);
                    if (q.subType === 'factors') typeLabel = '因數';
                    else if (q.subType === 'multiples') typeLabel = '倍數';
                    else if (q.subType === 'factors_range') typeLabel = '因數(限範圍)';
                    else if (q.subType === 'multiples_range') typeLabel = '倍數(限範圍)';
                    else if (q.subType === 'common_factors') typeLabel = '公因數';
                    else if (q.subType === 'common_multiples') typeLabel = '公倍數';
                } else if (q.type === 'fraction') {
                    mathContent = buildFractionHTML(q, show);
                    typeLabel = q.op === '+' ? '分數加法(異分母)' : '分數減法(異分母)';
                } else if (q.type === 'mul') {
                    mathContent = buildMulHTML(q.n1, q.n2, show);
                    typeLabel = '乘法直式';
                } else if (q.type === 'div') {
                    mathContent = buildDivHTML(q.n1, q.n2, show);
                    typeLabel = '除法直式';
                }
                return { mathContent, typeLabel };
        }

        // 列印：題目卷不含任何解答；答案卷展開全部解法。內容與畫面上的展開狀態無關
        function printSheet(kind) {
            if (!questions.length) return;
            if (kind === 'answers' && !teacherMode) return;
            const withAnswers = kind === 'answers';
            const printMode = currentSettings();
            const cells = questions.map((q, index) => {
                const { mathContent, typeLabel } = cardParts(q, withAnswers);
                return `<section class="print-cell"><div class="print-label">${q.label}・${typeLabel}</div><div class="print-body">${mathContent}</div></section>`;
            }).join('');
            const area = document.getElementById('printArea');
            area.innerHTML = `
                <div class="print-head">
                    <h2>${withAnswers ? '答案卷' : '數學練習'}・${modeDigitsLabel(printMode.mode, printMode.d1, printMode.d2)}</h2>
                    ${withAnswers ? '' : '<span class="print-fill">班級：______　姓名：______　日期：______</span>'}
                </div>
                <div class="print-grid">${cells}</div>`;
            const clear = () => { area.innerHTML = ''; window.removeEventListener('afterprint', clear); };
            window.addEventListener('afterprint', clear);
            window.print();
        }

        function renderAll() {
            const container = document.getElementById('quizContainer');
            let cards = '';

            questions.forEach((q, index) => {
                const { mathContent, typeLabel } = cardParts(q, teacherMode && q.show);

                const teacherControls = teacherMode ? `
                            <button id="refresh-${index}" type="button" onclick="refreshOne(event, ${index})" class="refresh-btn text-stone-600 hover:text-orange-700 hover:bg-stone-100 w-10 h-10 flex items-center justify-center rounded-md transition opacity-70 hover:opacity-100 focus-visible:opacity-100" aria-label="單獨更換${q.label}的數字" title="單獨更換此題數字"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>` : '';
                const revealControl = teacherMode ? `
                        <div class="mt-3 text-center">
                            <button id="reveal-${index}" type="button" onclick="toggleShow(${index})" aria-expanded="${q.show}" aria-controls="answer-${index}" class="text-sm font-bold text-orange-900 bg-white border border-orange-300 hover:bg-orange-50 px-5 min-h-[44px] rounded-md transition">
                                ${q.show ? '隱藏解答' : '顯示解答與解法'}
                            </button>
                        </div>` : '';
                const cardHtml = `
                    <article aria-label="${q.label} ${typeLabel}" class="cell">
                        <div class="flex justify-between items-center mb-3 min-h-[2.5rem]">
                            <span class="text-orange-800 font-bold text-sm">${q.label}・${typeLabel}</span>${teacherControls}
                        </div>
                        <div id="answer-${index}" class="flex-1 flex justify-center w-full items-start">
                            ${mathContent}
                        </div>${revealControl}
                    </article>
                `;
                cards += cardHtml;
            });
            container.innerHTML = cards;
            renderSheetHead();
            settledSnap = captureCurrent();
        }
    </script>
</body>
</html>
